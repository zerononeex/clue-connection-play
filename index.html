<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Clue Connection</title>
<style>
:root{--wood:#241710;--panel:#33231a;--cream:#f6ecd6;--gold:#ffc928;--a1:#e0b455;--a2:#8a5a34;--nav:84px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--wood);color:var(--cream);font:17px/1.3 Calibri,Arial,Helvetica,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3,p{margin:0}
#app{position:fixed;inset:0 0 calc(var(--nav) + env(safe-area-inset-bottom)) 0;overflow:auto}
/* shaped controls: medallions and pills, never plain rectangles */
.med{position:relative;display:grid;place-items:center;flex:none;width:56px;height:56px;border-radius:50%;color:var(--a1);
  background:radial-gradient(circle at 35% 30%,#6b4a2e,#2a1a10);border:3px solid var(--a1);
  box-shadow:0 0 0 3px var(--wood),0 0 0 5px var(--a2),0 6px 10px rgba(0,0,0,.5)}
.g{width:64%;height:64%;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.med.has-art .g{visibility:hidden}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border-radius:inherit}
/* puzzle scene: 100 units tall (10px per unit), as wide as its painting or its pane, panned and zoomed inside the view */
.view{position:relative;overflow:hidden;touch-action:none;background:#1a100a center/cover;cursor:grab}
.scene{position:absolute;left:0;top:0;height:1000px;overflow:hidden;transform-origin:0 0}
.shift{position:absolute;top:0;height:100%}
.shift>.bg,.shift>svg{position:absolute;inset:0;width:100%;height:100%}
.item{position:absolute}
.item small{position:absolute;left:50%;top:100%;transform:translateX(-50%);font-size:14px;white-space:nowrap;color:#000;background:#fff;border-radius:6px;padding:0 4px}
.chip{position:relative;display:grid;place-items:center;width:100%;height:100%;border-radius:28%;color:#fff;
  background:hsl(var(--h) 55% 42%) center/cover;border:.07em solid #fff;box-shadow:0 .1em 0 rgba(0,0,0,.35)}
.chip b{line-height:1}
.chip.has-art{background:none;border-color:transparent;box-shadow:none}
.chip.has-art .art{filter:drop-shadow(0 .05em .04em rgba(0,0,0,.5))}
.chip.crop{border-color:var(--a1)}
/* SAMPLE placeholder shapes: an item without a sprite is a coloured shape with its first letter */
.s1{border-radius:50%}
.s2{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.s3{clip-path:polygon(50% 0,100% 100%,0 100%)}
.s4{clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.s5{clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.s6{clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%)}
.s7{clip-path:polygon(33% 0,67% 0,67% 33%,100% 33%,100% 67%,67% 67%,67% 100%,33% 100%,33% 67%,0 67%,0 33%,33% 33%)}
.s3 b,.s5 b{font-size:.6em;transform:translateY(25%)}
.shade .chip{filter:brightness(0);opacity:.82}
.shade .chip b{visibility:hidden}
.patch{position:absolute;-webkit-mask-image:radial-gradient(closest-side,#000 72%,transparent);mask-image:radial-gradient(closest-side,#000 72%,transparent)}
.hintring{position:absolute;border:8px dashed var(--gold);border-radius:50%;pointer-events:none;animation:beat .6s infinite alternate}
@keyframes beat{to{transform:scale(1.12)}}
.hinted{animation:beat .5s infinite alternate;box-shadow:0 0 0 6px var(--gold) !important}
.verdict{position:absolute;right:-8%;top:-8%;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:#5b4a3c;color:#fff;z-index:2}
.verdict.yes{background:var(--gold);color:#3a2618}
.verdict .g{stroke-width:6}
.toast{position:fixed;left:50%;top:16px;z-index:30;transform:translateX(-50%);padding:10px 26px;border-radius:999px;font-weight:bold;pointer-events:none;
  border:3px solid var(--gold);background:var(--panel);animation:toast 2.2s both}
@keyframes toast{0%,100%{opacity:0}12%,80%{opacity:1}}
.bar{display:flex;align-items:center;gap:14px;padding:12px 16px}
.bar h1{flex:1;font-size:24px}
.mb{position:relative;display:inline-flex;flex-direction:column;align-items:center;gap:7px;min-width:64px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:8px 22px;border-radius:999px;font-weight:bold;text-align:left;
  border:3px solid var(--a1);background:linear-gradient(#5d3f27,#38241a);box-shadow:0 4px 0 #120b07,0 8px 12px rgba(0,0,0,.4)}
.pill:active:not(:disabled),.mb:active:not(:disabled) .med{transform:translateY(2px)}
button:disabled{opacity:.45;cursor:default}
.pill small,.tile small{display:block;font-size:13px;font-weight:normal;opacity:.85}
.num{font-size:24px;font-weight:bold}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding:8px 16px 24px}
.tile{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:30px;text-align:left;
  border:3px solid var(--a1);background:var(--panel);box-shadow:inset 0 0 0 3px var(--a2),0 6px 12px rgba(0,0,0,.4)}
.tile b+small+small{color:var(--gold)}
.cats{display:grid;gap:14px;justify-items:start;padding:8px 16px 24px}
.cat{width:100%;padding:14px;border-radius:30px;background:var(--panel);box-shadow:inset 0 0 0 3px var(--a2)}
.cathead{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.cathead .med{width:76px;height:76px}
.modes{display:flex;flex-wrap:wrap;gap:12px}
.mode{padding-left:8px}
.mode .med{width:40px;height:40px;border-width:2px;box-shadow:none}
.nums{display:grid;grid-template-columns:repeat(auto-fit,84px);gap:26px;justify-content:center;max-width:572px;margin:auto;padding:24px}
.nums .med{width:84px;height:84px;font-size:34px}
.tick{position:absolute;right:-6px;top:58px;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--gold);color:#3a2618}
/* a round in progress: its count under the number, and a small two-tap reset medallion on the tile */
.cell{position:relative;display:grid}
.cell small{width:84px;text-align:center}
.reset{position:absolute;right:-12px;top:-12px}
.reset .med{width:36px;height:36px;border-width:2px}
.reset.armed .med{color:var(--gold);border-color:var(--gold)}
/* play: the stage plus a side sheet (landscape) or bottom sheet (portrait) holding the clue, the powers and the Found Tray */
.playing #app{bottom:0}
.play{display:grid;height:100%;grid-template-columns:1fr auto}
.side{position:relative;display:flex;flex-direction:column;gap:8px;width:264px;min-height:0;overflow:hidden;padding:8px 8px 84px;background:var(--panel)}
.side .bar{padding:0 52px 4px 0}
.side h1{font-size:18px}
.side .med{width:44px;height:44px}
#list{flex:none;margin:0;padding:0;list-style:none;columns:2;font-size:13px}
#list li{display:flex;align-items:center;gap:3px;padding:2px 0;break-inside:avoid}
#list .g{flex:none;width:13px;height:13px;stroke-width:6;color:var(--gold);visibility:hidden}
#list .chip{flex:none;width:20px;height:20px;font-size:12px}
#list .done{color:#a8977c;text-decoration:line-through}
#list .done .g{visibility:visible}
#clue{display:grid;gap:8px;justify-items:start;font-size:16px}
#clue .riddle{padding:8px 14px;border-radius:18px;background:#1c120c;font-style:italic}
#clue .pill{min-height:40px;padding:4px 16px;font-size:14px}
.lens{display:block;width:150px;height:150px;border-radius:50%;overflow:hidden;border:4px solid var(--gold);box-shadow:0 0 0 4px var(--a2)}
.lens .chip{border:0;border-radius:0}
.tray{flex:1;min-height:0;overflow:auto;padding:8px;border-radius:20px;border:3px solid var(--a1);background:#1c120c;box-shadow:inset 0 0 0 3px var(--a2)}
.tray h2{font-size:16px;margin-bottom:6px}
#tray{display:flex;flex-wrap:wrap;gap:6px 2px}
.got{display:flex;flex-direction:column;align-items:center;gap:2px;width:56px;font-size:11px;line-height:1.1;text-align:center}
.got .chip{width:38px;height:38px;font-size:22px}
/* the power toolbar: the same five slots on every home and in play, growing as machines are finished */
.powers{display:flex;align-items:flex-start;gap:6px}
.powers .mb{min-width:46px;font-size:10px;gap:3px;text-align:center;line-height:1}
.powers .med{width:38px;height:38px;border-width:2px;box-shadow:none}
.powers .off .med{border-style:dashed;opacity:.5}
.powers .armed .med{color:var(--gold);border-color:var(--gold)}
/* the sheet's one toggle: the count row. Slimmed, it is all that stays: count, next thing to find, chevron medallion */
.slim{display:flex;align-items:center;gap:8px;text-align:left}
.slim .med{position:absolute;right:8px;top:8px}
#next{display:none}
.slimmed .side{width:84px;padding:8px}
.slimmed .side>:not(.slim),.slimmed #nav,.peeking .side,.peeking #nav{display:none}
.slimmed .slim{flex-direction:column;font-size:14px;text-align:center}
.slimmed .slim .med{position:static;order:-1}
.slimmed .slim .g{transform:rotate(180deg)}
.slimmed #next{display:block}
.pulse{animation:pulse .5s}
@keyframes pulse{40%{transform:scale(1.08);color:var(--gold)}}
/* Compare It: the two pictures side by side on wide screens, one at a time with a switch on narrow ones */
.duo{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:6px;min-width:0;min-height:0}
.tag{position:absolute;left:10px;top:10px;z-index:3;padding:2px 14px;border-radius:999px;background:var(--panel);border:2px solid var(--a1);font-size:13px;pointer-events:none}
.flipper{display:none;position:absolute;left:50%;bottom:10px;z-index:4;transform:translateX(-50%)}
/* tray rounds and picture choices: big round-cornered badges */
.flat{cursor:default;touch-action:manipulation}
.cards{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:16px;background:rgba(20,12,8,.74)}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:16px}
.card{position:relative;display:block;width:clamp(84px,17vw,150px);aspect-ratio:1;padding:12px;border-radius:26%;font-size:clamp(34px,7vw,64px);
  border:3px solid var(--a1);background:var(--cream);box-shadow:0 0 0 3px var(--wood),0 0 0 6px var(--a2),0 8px 14px rgba(0,0,0,.5)}
.card.show{border-color:var(--gold)}
#over{position:absolute;inset:0;pointer-events:none}
#over>*{pointer-events:auto}
.peekbar{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:6px 8px 6px 22px;border-radius:999px;
  background:var(--panel);border:3px solid var(--gold);white-space:nowrap}
.curtain{position:absolute;inset:0;background:var(--wood);animation:curtain 1s both}
@keyframes curtain{0%{opacity:0}45%,55%{opacity:1}100%{opacity:0}}
.choices{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:16px}
.choices .card{width:clamp(76px,13vw,120px);font-size:clamp(30px,5vw,50px)}
@media (orientation:portrait){
  .play{grid-template-columns:none;grid-template-rows:1fr auto}
  .side,.slimmed .side{width:auto;padding:8px}
  #list{columns:4}
  .tray{min-height:84px;margin-right:76px}
  .slim .g{transform:rotate(90deg)}
  .slimmed .side{padding-bottom:max(8px,env(safe-area-inset-bottom))}
  .slimmed .slim{flex-direction:row;font-size:inherit;text-align:left}
  .slimmed .slim .med{order:0}
  .slimmed .slim .g{transform:rotate(-90deg)}
  .slimmed #next{flex:1}
  .duo{grid-template-columns:1fr}
  .duo #view2,.flip .duo #view{display:none}
  .flip .duo #view2,.flipper{display:block}
  .home .bar{flex-wrap:wrap;gap:6px 14px}
  .stagew{padding:0 4px;gap:2px}
  .stagew>.mb{min-width:0}
  .stagew>.mb span:not(.med){display:none}
  .stagew>.mb .med{width:34px;height:34px;border-width:2px}
}
/* found sequence: golden ring draws itself, pop and sparkles, then the thing goes to the tray */
.ring{position:absolute;left:-20%;top:-20%;width:140%;height:140%;overflow:visible;pointer-events:none}
.ring circle{fill:none;stroke:var(--gold);stroke-width:9;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;animation:draw .35s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pop .chip{animation:pop .4s}
@keyframes pop{40%{transform:scale(1.3)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7%)}50%{transform:translateX(7%)}75%{transform:translateX(-4%)}}
.fly{position:fixed;z-index:9;transform-origin:0 0;transition:transform .5s ease-in}
.sparks{position:absolute;left:50%;top:50%;pointer-events:none}
.sparks i{position:absolute;left:-7px;top:-7px;width:14px;height:14px;background:var(--gold);--d:-70px;animation:spark .7s ease-out both;
  clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
@keyframes spark{from{transform:rotate(var(--r));opacity:0}15%{opacity:1}to{transform:rotate(var(--r)) translateY(var(--d)) scale(.2);opacity:0}}
.win{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(20,12,8,.8)}
.card.note,.wincard{display:grid;gap:16px;justify-items:center;padding:28px 36px;border-radius:36px;text-align:center;
  border:4px solid var(--gold);background:var(--panel);box-shadow:0 0 60px rgba(255,201,40,.4)}
.wincard b{color:var(--gold)}
/* Wonder Machine home: the machine's own room, with the machine assembled from its pieces on a 1000 x 750 stage */
.home{display:flex;flex-direction:column;height:100%}
.home .powers small{align-self:center;margin-right:4px}
.stagew{flex:1;display:flex;align-items:center;gap:6px;min-height:0;padding:0 10px}
.room{position:relative;flex:1;min-width:0;height:100%;overflow:hidden;touch-action:pan-y;border-radius:24px}
.mstage{position:absolute;left:0;top:0;width:1000px;height:750px;overflow:hidden;transform-origin:0 0;background:center/cover;border-radius:24px}
.sp{position:absolute;width:0;height:0}
.sp img{position:absolute;left:0;top:0;max-width:none}
.piece.fly{animation:flyin .9s cubic-bezier(.3,1.3,.5,1) backwards}
@keyframes flyin{from{scale:2.6;opacity:0}}
.sp .sparks i{animation-delay:.7s;--d:-90px}
.fx{opacity:0}
.runner img{transform:translate(-50%,-100%)}
@keyframes spin{to{rotate:360deg}}
@keyframes fxin{from{opacity:0;scale:.3}to{opacity:1;scale:1}}
@keyframes breathe{to{scale:1.08}}
@keyframes twinkle{to{opacity:.35}}
@keyframes rise{from{opacity:0;translate:0 70px}to{opacity:1;translate:0 -30px}}
@keyframes bob{from{translate:0 -30px}to{translate:0 -44px}}
@keyframes flyout{from{opacity:0;translate:0 60px;scale:.5}30%{opacity:1}to{opacity:1;translate:170px -120px;scale:1}}
@keyframes flap{from{translate:170px -120px;rotate:-5deg}to{translate:180px -134px;rotate:5deg}}
@keyframes lift{to{translate:0 -150px;opacity:0}}
@keyframes seed{from{opacity:0;scale:.5}25%,75%{opacity:1;scale:1}to{opacity:0;scale:1.15}}
@keyframes sky{0%{opacity:0;translate:0 8px}2%,10%{opacity:1;translate:0 0}12%,100%{opacity:0}}
@keyframes night{0%,74%{opacity:0}80%,97%{opacity:1}100%{opacity:0}}
.fx-show{opacity:1}
.fx-glow{animation:fxin 1s calc(var(--t0) + var(--at)) both,breathe 3s calc(var(--t0) + var(--at) + 1s) infinite alternate}
.fx-twinkle,.fx-star{animation:fxin .8s calc(var(--t0) + var(--at)) both,twinkle 1.8s calc(var(--t0) + var(--at) + .8s) infinite alternate}
.fx-rise{animation:rise 1.4s calc(var(--t0) + var(--at)) both,bob 2.4s calc(var(--t0) + var(--at) + 1.4s) infinite alternate}
.fx-fly{animation:flyout 2.2s calc(var(--t0) + var(--at)) both,flap 1s calc(var(--t0) + var(--at) + 2.2s) infinite alternate}
.fx-lift{animation:lift 1.4s var(--t0) both}
.fx-seed{animation:seed 1.6s calc(var(--t0) + var(--at)) both}
.fx-sky{animation:sky 27s calc(var(--t0) + var(--at)) infinite}
.night{position:absolute;left:411px;top:111px;width:178px;height:307px;z-index:8;border-radius:89px 89px 20px 20px;background:rgba(8,14,60,.55);opacity:0;
  animation:night 27s calc(var(--t0) + 5.5s) infinite}
.lamps{display:inline-flex;gap:5px;vertical-align:middle;margin:0 8px}
.bulb{width:11px;height:11px;border-radius:50%;background:#4a3a2e}
.bulb.lit{background:#ffe08a;box-shadow:0 0 6px #ffd76a}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px 14px}
.foot b{color:var(--gold)}
.big{padding:10px 44px;font-size:22px}
/* the bottom banner: the same five medallions in landscape and portrait; one Home medallion during play */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:space-around;align-items:center;
  height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:linear-gradient(#3a2618,#1b110a);border-top:3px solid var(--a2);box-shadow:0 -4px 12px rgba(0,0,0,.5)}
#nav .mb{gap:6px;font-size:12px}
#nav .med{width:46px;height:46px}
.playing #nav{left:auto;right:10px;bottom:10px;height:auto;padding:0;background:none;border:0;box-shadow:none}
/* settings */
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;padding:8px 16px 24px}
.sets h2{margin-bottom:12px}
.sets .pill{margin:0 10px 6px 0}
.code{margin-bottom:12px;font-size:13px;word-break:break-all;-webkit-user-select:all;user-select:all}
.field{width:100%;min-height:48px;margin-bottom:12px;padding:8px 18px;border-radius:999px;border:3px solid var(--a2);
  background:#1c120c;color:var(--cream);font:inherit;-webkit-user-select:text;user-select:text}
.slider{-webkit-appearance:none;appearance:none;width:min(100%,420px);height:22px;margin:14px 0;border-radius:999px;
  border:3px solid var(--a1);background:#1c120c;box-shadow:inset 0 0 0 2px var(--a2)}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:44px;height:44px;border-radius:50%;border:3px solid var(--a1);
  background:radial-gradient(circle at 35% 30%,#ffe08a,#b9812a);box-shadow:0 0 0 3px var(--wood),0 0 0 5px var(--a2),0 4px 8px rgba(0,0,0,.5)}
.slider::-moz-range-thumb{width:40px;height:40px;border-radius:50%;border:3px solid var(--a1);
  background:radial-gradient(circle at 35% 30%,#ffe08a,#b9812a);box-shadow:0 0 0 3px var(--wood),0 0 0 5px var(--a2),0 4px 8px rgba(0,0,0,.5)}
.toggle{position:relative;display:flex;align-items:center;width:136px;height:64px;padding:0 6px;border-radius:999px;
  border:3px solid var(--a1);background:#1c120c;box-shadow:inset 0 0 0 3px var(--a2),0 6px 10px rgba(0,0,0,.4)}
.toggle .med{width:46px;height:46px;color:#8d7c66;border-color:#8d7c66;transition:transform .2s}
.toggle b{position:absolute;right:20px}
.toggle[aria-checked=true]{background:linear-gradient(#6f9440,#3f5f22)}
.toggle[aria-checked=true] .med{transform:translateX(72px);color:var(--gold);border-color:var(--gold)}
.toggle[aria-checked=true] b{left:20px;right:auto}
.toggle[aria-checked=false] .med::after{content:"";position:absolute;width:3px;height:74%;border-radius:2px;background:currentColor;transform:rotate(45deg)}
.toggle.has-art{border:0;background:none;box-shadow:none}
.toggle.has-art>:not(.art){visibility:hidden}
.test{max-width:900px;max-height:92%;overflow:auto;text-align:left;justify-items:start;-webkit-user-select:text;user-select:text}
.test ul{margin:0;padding:0;list-style:none}
.test li{padding:3px 0}
.test .ok b{color:#9bdc74}
.test .bad b{color:#ff9478}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<audio id="music" loop></audio>
<script>
'use strict';
// ---------- LABELS: every display name lives here; rename in one line ----------
const LABELS = {
  title: 'Clue Connection',
  cat: { find: 'Find It', compare: 'Compare It', remember: 'Remember It', figure: 'Deduce It' },
  mode: {
    'i-spy': 'I Spy', 'hidden-object': 'Find Them All', count: 'Count Them', twins: 'Find the Twins',
    'spot-difference': 'Spot the Difference', 'odd-one-out': 'Odd One Out', shadow: 'Shadow Match',
    vanished: "What's Missing?", changed: 'What Changed?', 'doesnt-belong': "Which Doesn't Belong?", zoom: 'Tiny Clues'
  },
  prompt: {
    'i-spy': 'Read the riddle and find the thing.', count: 'How many can you find? Tap every one.',
    twins: 'Two of these things are twins. Find them both!', 'spot-difference': 'Find what is different between the two pictures.',
    'odd-one-out': 'One is different. Tap it.', shadow: 'Which shadow fits?', vanished: 'What is missing now?', changed: 'What changed?',
    'doesnt-belong': 'Which one does not belong?', zoom: 'Where is this? Find it in the big picture.'

// A square close-up of the painting around a box; f < 1 shows only the middle of it, enlarged.
function cropPic(w, b, f = 1) {
  const s = Math.min(100, Math.max(b.w, b.h) * f), x = Math.min(Math.max(b.x + b.w / 2 - s / 2, 0), w.w - s), y = Math.min(Math.max(b.y + b.h / 2 - s / 2, 0), 100 - s);
  return `<span class="chip crop" style="background-image:url(${w.background});background-size:${w.w / s * 100}% ${10000 / s}%;` +
    `background-position:${x / (w.w - s) * 100}% ${s < 100 ? y / (100 - s) * 100 : 0}%"></span>`;
}
const boxCss = (b, g = 0) => `left:${(b.x - g) * 10}px;top:${(b.y - g) * 10}px;width:${(b.w + 2 * g) * 10}px;height:${(b.h + 2 * g) * 10}px`;
const sprite = (p, id) => {
  const d = p.d * 10;
  return `<div class="item" id="${id}-${p.k}" style="left:${p.x * 10 - d / 2}px;top:${p.y * 10 - d / 2}px;width:${d}px;height:${d}px;font-size:${d * .6}px">` +
    `${pic(p.item)}${DEV ? `<small>${p.item.name}</small>` : ''}</div>`;
};

// ---------- Scene renderer ----------
// b = 0 draws the round as dealt, b = 1 its changed twin (Compare It, Remember It). A painted object changes under a
// cover patch. SAMPLE: until the owner's variant plates exist, the patch is a soft copy of the painting next to the
// object, with the replacing item (sprite or placeholder) drawn over it.
function sceneHTML(r, b, id = b ? 2 : '') {
  const w = r.w, pane = r.pane || { x: 0, w: w.w }, diffs = b ? r.diffs : [], pre = id ? 'j' : 'i';
  const zonesDev = !DEV ? '' : `<svg viewBox="0 0 ${w.w} 100" preserveAspectRatio="none">` + w.zones.map(z =>
    `<rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" fill="none" stroke="#c00" stroke-width=".3" stroke-dasharray="1"/>` +
    `<text x="${z.x}" y="${z.y - .5}" font-size="1.6" fill="#c00">${z.id} (max ${z.maxSize})</text>`).join('') + `</svg>`;
  const patches = diffs.filter(d => d.spot).map(({ spot: s, item }) => {
    const from = s.x + s.w * 2.2 < w.w ? s.x + s.w * 1.2 : s.x - s.w * 1.2;
    return `<div class="patch" style="${boxCss(s, 1)};background:url(${w.background}) ${-(from - 1) * 10}px ${-(s.y - 1) * 10}px/${w.w * 10}px 1000px"></div>` +
      (item ? sprite({ k: s.id + '-cover', item, x: s.x + s.w / 2, y: s.y + s.h / 2, d: Math.max(s.w, s.h) }, 'c') : '');
  }).join('');
  const sprites = r.placed.map(p => {
    const d = diffs.find(d => d.was === p);
    return r.kind === 'scene' && r.found.includes(p.k) || d && !d.item ? '' : sprite(d ? { ...p, item: d.item } : p, pre);
  }).join('');
  cam.w = pane.w * 10;
  cam.whole = !!r.pane; // a pane is shown whole (nothing to notice may sit off screen); a full scene covers the view and pans
  return `<div class="scene" id="scene${id}" style="width:${cam.w}px"><div class="shift" style="left:${-pane.x * 10}px;width:${w.w * 10}px">` +
    `<img class="bg" src="${w.background}" alt="" draggable="false">${zonesDev}${patches}${sprites}</div></div>`;
}
// Camera: drag to pan, pinch or wheel to zoom. Two views share the one camera.
const cam = { x: 0, y: 0, s: 1, min: 1, max: 4, w: 2000, whole: false };
function moveCam(view) {
  cam.s = Math.min(Math.max(cam.s, cam.min), cam.min * cam.max);
  const edge = (at, room) => room > 0 ? room / 2 : Math.min(0, Math.max(at, room)); // room to spare is shared left and right
  cam.x = edge(cam.x, view.clientWidth - cam.w * cam.s);
  cam.y = edge(cam.y, view.clientHeight - 1000 * cam.s);
  $$('.scene').forEach(s => { s.style.transform = `translate(${cam.x}px,${cam.y}px) scale(${cam.s})`; });
}
function mountScene(view, onTap) {
  const pts = new Map();
  let moved = 0, pinch = 0;
  const fit = view.fit = () => { // runs whenever the view changes size (rotation, the sheet sliding); a zoomed-in camera keeps its pan and zoom
    if (!view.clientWidth) return view.isConnected || sized.disconnect();
    const k = Math[cam.whole ? 'min' : 'max'](view.clientWidth / cam.w, view.clientHeight / 1000) / cam.min;
    if (cam.s <= cam.min) { cam.s *= k; cam.x *= k; cam.y *= k; } // fully zoomed out stays fully zoomed out
    cam.min *= k;
    moveCam(view);
  }, sized = new ResizeObserver(fit);
  const zoom = view.zoom = (f, cx, cy) => {
    const s = Math.min(Math.max(cam.s * f, cam.min), cam.min * cam.max), r = view.getBoundingClientRect();
    cam.x = cx - r.left - (cx - r.left - cam.x) * s / cam.s;
    cam.y = cy - r.top - (cy - r.top - cam.y) * s / cam.s;
    cam.s = s;
    moveCam(view);
  };
  view.onpointerdown = e => { if (e.target.closest("button")) return; view.setPointerCapture(e.pointerId); if (!pts.size) moved = 0; pts.set(e.pointerId, e); };
  view.onpointermove = e => {
    const was = pts.get(e.pointerId);
    if (!was) return;
    pts.set(e.pointerId, e);
    if (pts.size === 1) {
      cam.x += e.clientX - was.clientX;
      cam.y += e.clientY - was.clientY;
      moved += Math.abs(e.clientX - was.clientX) + Math.abs(e.clientY - was.clientY);
    } else {
      const [a, b] = [...pts.values()], dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      if (pinch) zoom(dist / pinch, (a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2);
      pinch = dist;
      moved = 99;
    }
    moveCam(view);
  };
  view.onpointerup = view.onpointercancel = e => {
    pts.delete(e.pointerId);
    pinch = 0;
    if (e.type !== 'pointerup' || pts.size || moved > 10 || e.target.closest('button')) return;
    const r = view.getBoundingClientRect(); // tap: convert to scene units
    onTap((e.clientX - r.left - cam.x) / cam.s / 10, (e.clientY - r.top - cam.y) / cam.s / 10);
  };
  view.onwheel = e => { e.preventDefault(); zoom(e.deltaY < 0 ? 1.15 : .87, e.clientX, e.clientY); };
  fit();
  sized.observe(view);
}

const SCREENS = {

  modes: () => bar(WORLDS.find(w => w.id === cur.world).name, 'worlds') + `<div class="cats">` +

        btn('mode', m, `${icon(m)}<span>${LABELS.mode[m]}<small>${modeProgress(cur.world, m).clearedSubStages.length} / 10</small></span>`, 'pill mode')).join('') +

      (r.mode === 'hidden-object' ? `<ul id="list">${r.need.map(k => `<li id="l-${k}"${r.found.includes(k) ? ' class="done"' : ''}>${glyph('check')}` +

      `<section class="tray"><h2>${LABELS.ui.found}</h2><div id="tray">${r.found.map(chipOf).join('')}</div></section></aside></div>`;
  }
};

// ---------- Wonder Machine homes: the frozen art, assembled on a 1000 x 750 stage from machines.json ----------
// One sprite: a zero-size anchor at its centre (or pivot) holding the image, so animations turn and grow about that point.
function spriteHTML(mid, name, p, id, cls = '') {
  let c = p.c, img;
  if (p.cut) { // Marble Rail: cut from the route master; its recorded position is its cut's bounding box on the canvas
    const [cx, cy, cw, ch] = MACH.machines[mid].canvas, xs = p.cut.map(q => q[0]), ys = p.cut.map(q => q[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    c = [cx + (x0 + x1) / 200 * cw, cy + (y0 + y1) / 200 * ch];
    img = `width:${(x1 - x0) / 100 * cw}px;transform:translate(-50%,-50%)`;
  } else if (p.q) {
    const [ox, oy, ux, uy, vx, vy] = p.q;
    c = [ox + (ux + vx) / 2, oy + (uy + vy) / 2];
    img = `width:100px;height:100px;transform-origin:0 0;transform:matrix(${ux / 100},${uy / 100},${vx / 100},${vy / 100},${-(ux + vx) / 2},${-(uy + vy) / 2})`;
  } else {
    const [px, py] = p.pivot || [.5, .5];
    img = `width:${p.w}px;transform:translate(${-px * 100}%,${-py * 100}%)`;
  }
  return `<i class="sp ${cls}" id="${id}" style="left:${c[0]}px;top:${c[1]}px;z-index:${p.z ?? 1};${p.o ? `opacity:${p.o};` : ''}${p.at != null ? `--at:${p.at}s;` : ''}` +
    `${p.spin && cls.includes('live') ? `animation:spin ${Math.abs(p.spin)}s linear infinite${p.spin < 0 ? ' reverse' : ''}` : ''}">` +
    `<img src="assets/machines/${mid}/web/${name}.webp" alt="" draggable="false" style="${img}"></i>`;
}
SCREENS.home = () => {
  const earned = save.machines.justEarned; // drives the new piece's fly-in exactly once, then is cleared
  if (earned) {
    cur.home = earned.machine;
    delete save.machines.justEarned;
    storeSave();
  }
  const i = cur.home, m = MACHINES[i], a = MACH.machines[m.id] || { base: { c: [500, 375], w: 1 }, pieces: [] }, n = save.machines.pieces[i], runs = n === 10;
  const arrow = (to, glyphId) => btn('machine', to, icon(glyphId) + `<span>${MACHINES[to] ? MACHINES[to].name : ''}</span>`, 'mb', !MACHINES[to]);
  const pieces = a.pieces.slice(0, n).map((p, k) => spriteHTML(m.id, `piece-${String(k + 1).padStart(2, '0')}`, p, `p${k + 1}`,
    `piece on${earned && k === n - 1 ? ' fly' : ''}${runs ? ' live' + (p.fx ? ' fx-' + p.fx : '') : ''}`).replace('</i>', (earned && k === n - 1 ? sparks : '') + '</i>')).join('');
  const finale = !runs ? '' : Object.entries(a.sprites || {}).filter(([, p]) => p.fx).map(([name, p]) => spriteHTML(m.id, name, p, 'fx-' + name, 'fx fx-' + p.fx)).join('');
  return `<div class="home"><header class="bar"><h1>${LABELS.title}</h1><div class="powers"><small>${LABELS.ui.powers}</small>${powerBar()}</div></header>` +
    `<div class="stagew">${arrow(i - 1, 'back')}<div class="room"><div class="mstage${runs ? ' runs' : ''}" id="mstage" ` +
    `style="background-image:url(assets/machines/${m.id}/web/home.jpg);--t0:${earned ? 1 : .3}s">${spriteHTML(m.id, 'base', { z: 0, ...a.base }, 'base')}${pieces}${finale}</div></div>` +
    `${arrow(i + 1, 'next')}</div><footer class="foot"><div><h2>${m.name}</h2><small>${n} / 10 ${LABELS.ui.pieces}</small>` +
    `<span class="lamps">${a.pieces.map((_, k) => `<i class="bulb${k < n ? ' lit' : ''}"></i>`).join('')}</span>` +
    `<b>${runs ? LABELS.ui.runs : i > save.machines.current ? LABELS.ui.later : ''}</b></div>` +
    `<span>${runs ? btn('machine', i, LABELS.ui.again) : ''} ${btn('show', 'worlds', LABELS.ui.play, 'pill big')}</span></footer></div>`;
};
function fitStage() {
  const room = $('.room'), st = $('#mstage');
  if (!st) return;
  const s = Math.min(room.clientWidth / 1000, room.clientHeight / 750);
  st.style.transform = `translate(${(room.clientWidth - 1000 * s) / 2}px,${(room.clientHeight - 750 * s) / 2}px) scale(${s})`;
}
addEventListener('resize', fitStage);
// The moving parts that plain CSS cannot do. t0 = ms to wait while a new piece flies in.
const LIVE = {
  // Marble Rail: a marble rolls as far as the built track reaches and wobbles at the gap; at 10 of 10 two marbles roll
  // the whole route into the chest, which opens.
  'marble-rail'(st, a, n, t0) {
    if (!n) return;
    const [cx, cy, cw, ch] = a.canvas, S = a.sprites, done = n === 10;
    const pts = a.pieces.slice(0, n).flatMap(p => p.route).map(([x, y]) => [cx + x / 100 * cw, cy + y / 100 * ch]);
    if (done) {
      pts.push(S.chest.c);
      st.insertAdjacentHTML('beforeend', spriteHTML('marble-rail', 'chest', { z: 6, ...S.chest }, 'chest') + spriteHTML('marble-rail', 'chest-open', { z: 6, ...S['chest-open'] }, 'chest-open', 'fx'));
    }
    let len = 0;
    const at = pts.map((p, i) => len += i ? Math.hypot(p[0] - pts[i - 1][0], p[1] - pts[i - 1][1]) : 0), roll = len / .24, total = roll + (done ? 500 : 1800);
    const last = pts[pts.length - 1], frames = pts.map((p, i) => ({ translate: `${p[0]}px ${p[1]}px`, opacity: 1, offset: at[i] / len * roll / total }));
    if (!done) [5, -5, 3, 0].forEach((dx, i) => frames.push({ translate: `${last[0] + dx}px ${last[1]}px`, opacity: 1, offset: (roll + 160 * (i + 1)) / total }));
    frames.push({ translate: `${last[0]}px ${last[1]}px`, opacity: 0, offset: 1 });
    ['marble-blue', 'marble-gold'].slice(0, done ? 2 : 1).forEach((name, i) => {
      st.insertAdjacentHTML('beforeend', spriteHTML('marble-rail', name, { c: [0, 0], w: S[name].w, z: 5 }, 'marble-' + i, 'marble'));
      st.lastChild.animate(frames, { duration: total, delay: t0 + i * 800, iterations: Infinity, fill: 'backwards' });
    });
    if (done) setTimeout(() => { // the first marble lands: the chest opens
      if (!st.isConnected) return;
      $('#chest').style.opacity = 0;
      $('#chest-open').style.opacity = 1;
      $('#chest-open').insertAdjacentHTML('beforeend', sparks);
    }, t0 + roll);
  },
  // Terrarium: the Time Seed sequence is CSS; this is the night that falls inside the dome during the weather cycle.
  terrarium(st, a, n) { if (n === 10) st.insertAdjacentHTML('beforeend', `<div class="night"></div>`); },
  // Wallpaper Art Odyssey: the runner steps out of the door in picture 1, runs and jumps across the five pictures
  // through the shimmering seams between the frames, and opens the chest in picture 5.
  async 'wallpaper-art-odyssey'(st, a, n, t0) {
    if (n < 10) return;
    const f = a.frames, S = a.sprites, GROUND = [.71, .7, .69, .71, .56], src = name => `assets/machines/wallpaper-art-odyssey/web/${name}.webp`;
    const foot = (i, u) => [f[i][0] + u * f[i][2], f[i][1] + GROUND[i] * f[i][3]], sleep = ms => new Promise(done => setTimeout(done, ms));
    f.slice(1).forEach((b, i) => st.insertAdjacentHTML('beforeend', spriteHTML('wallpaper-art-odyssey', 'seam',
      { c: [(f[i][0] + f[i][2] + b[0]) / 2, b[1] + b[3] / 2], w: 62, z: 4, at: i * .3 }, 'seam-' + i, 'fx fx-twinkle')));
    st.insertAdjacentHTML('beforeend', spriteHTML('wallpaper-art-odyssey', 'chest-open', { z: 4, ...S['chest-open'] }, 'chest-open', 'fx') +
      `<i class="sp runner fx" id="runner" style="z-index:5"><img src="${src('door')}" alt="" draggable="false" style="height:58px"></i>`);
    const runner = $('#runner'), img = runner.firstChild;
    let at = foot(0, .5), step = 0;
    const pose = name => { img.src = src(name); };
    const go = async (to, ms, hop) => { // moves the runner's feet; a hop arcs through the air
      const mid = [(at[0] + to[0]) / 2, Math.min(at[1], to[1]) - hop];
      await runner.animate([at, ...(hop ? [mid] : []), to].map(p => ({ translate: `${p[0]}px ${p[1]}px` })), { duration: ms, fill: 'forwards', easing: hop ? 'ease-in-out' : 'linear' }).finished;
      at = to;
    };
    const legs = setInterval(() => st.isConnected && runner.dataset.run ? pose(step++ % 2 ? 'run-1' : 'run-2') : st.isConnected || clearInterval(legs), 140);
    await sleep(t0 + 400);
    runner.style.translate = `${at[0]}px ${at[1]}px`;
    runner.style.opacity = 1;
    pose('door');
    await sleep(900);
    for (let i = 0; i < 5 && st.isConnected; i++) {
      runner.dataset.run = 1;
      await go(foot(i, i === 4 ? .22 : .82), i === 4 ? 300 : 900, 0);
      runner.dataset.run = '';
      if (i === 4) break;
      pose('crouch');
      await sleep(160);
      pose('jump');
      await go(foot(i + 1, .16), 620, 46);
      pose('land');
      await sleep(180);
    }
    if (!st.isConnected) return;
    clearInterval(legs);
    pose('cheer');
    $('#p10').style.opacity = 0;
    $('#chest-open').style.opacity = 1;
    $('#chest-open').insertAdjacentHTML('beforeend', sparks);
  }
};

// ---------- Bottom banner: always the same five medallions; one Home medallion during play ----------

  nav.innerHTML = cur.screen === 'play' ? navButton('show', 'home', 'home', LABELS.ui.home) :

    const loops = music.loop && count('audio') === 1;
    $('.toggle').click();
    const off = music.paused && music.muted;
    audioOn = false;
    return same(seen, want) && loops && off;
  });
  await test('ab', 'A save code exported mid-progress restores machines, powers, unlocks and the round in progress exactly; a save from before this build migrates (its machine keeps its pieces and gains its power, its old part-played rounds are dropped)', async () => {
    reset();
    clear(10); clear(3, 'twins', W2);
    open('count', 1, W2);
    tapScene(...centre(round.need[0]));
    const code = exportCode(), want = JSON.parse(JSON.stringify(save));
    const unlocks = () => WORLDS.map(w => MODES.map(m => TEN.filter(n => isUnlocked(w.id, m, n)))), opened = unlocks();
    reset(); show('settings');
    $('#paste').value = code;
    $('[data-act=load]').click();
    const exact = same(save.machines, want.machines) && same(save.powers, ['zoom']) && same(save.progress, want.progress) && same(save.inProgress, want.inProgress) &&
      same(unlocks(), opened) && save.machines.pieces.join() === '10,3,0,0,0' && stored() === JSON.stringify(want) && cur.home === 1;
    open('count', 1, W2);
    const resumed = round.found.length === 1 && $('#count').textContent.startsWith('1 ');
    const old = fresh();
    delete old.dealt;
    Object.assign(old.machines, { current: 1, pieces: [10, 4, 0, 0, 0], completed: [0] });
    old.progress.worlds[W] = { modes: { [M]: { clearedSubStages: TEN, currentSubStage: 10 } } };
    old.inProgress = { [K]: { found: [`${W}-001`], updatedAt: 1 } };
    localStorage.setItem(KEY, JSON.stringify(old));
    loadSave();
    return exact && resumed && same(save.powers, ['zoom']) && save.dealt === DEALT && !save.inProgress && save.machines.pieces.join() === '10,4,0,0,0' &&
      modeProgress(W, M).clearedSubStages.length === 10 && same(readCode(exportCode()), save);
  });
  await test('ac', 'Sprites come from each world\'s items/manifest.json with no code change: the Attic\'s 20 sliced sample items draw as art, every other item as a placeholder; all 11 modes and all 10 worlds are open from the start; Play Together is shown and disabled', async () => {
    const m = await (await fetch(`assets/worlds/${W}/items/manifest.json`)).json(), ids = Object.keys(m.items), A = WORLDS[0];
    for (const id of ids) if (!(await fetch(A.byId[id].sprite)).ok) throw new Error(id);
    reset(); open(M);
    const drawn = round.placed.every(p => !!$(`#i-${p.k} img.art`) === ids.includes(p.item.id) && !!$(`#i-${p.k} .chip b`) !== ids.includes(p.item.id));
    show('worlds');
    const worlds = count('.tile:not(:disabled)') === 10;
    ACT.world(W2);
    const modes = count('.mode:not(:disabled)') === 11;
    show('settings');
    return ids.length === 20 && A.items.filter(i => i.sprite).length === 20 && WORLDS.slice(1).every(w => w.items.every(i => !i.sprite)) && drawn && worlds && modes &&
      count('#together button') === 2 && count('#together button:disabled') === 2;
  });
  realSave === null ? localStorage.removeItem(KEY) : localStorage.setItem(KEY, realSave); // hand the real save back
  loadSave();
  applyAudio();
  cur.home = save.machines.current;
  cur.world = W;
  cur.mode = M;
  show('home');
  history.replaceState(null, '', location.pathname + location.search);
  document.body.insertAdjacentHTML('beforeend', `<div class="win"><div class="wincard test"><h1>Self-test: ` +
    `${results.filter(r => r.includes('PASS')).length} of ${results.length} passed</h1><ul>${results.join('')}</ul></div></div>`);
}
