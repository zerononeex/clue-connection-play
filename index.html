<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Clue Connection</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<style>
:root{--wood:#241710;--panel:#33231a;--cream:#f6ecd6;--gold:#ffc928;--a1:#e0b455;--a2:#8a5a34}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--wood);color:var(--cream);font:17px/1.3 Calibri,Arial,Helvetica,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3,p{margin:0}
#app{position:fixed;inset:0;overflow:auto}
/* shaped controls: medallions and pills, never plain rectangles */
.med{position:relative;display:grid;place-items:center;flex:none;width:56px;height:56px;border-radius:50%;color:var(--a1);
  background:radial-gradient(circle at 35% 30%,#6b4a2e,#2a1a10);border:3px solid var(--a1);
  box-shadow:0 0 0 3px var(--wood),0 0 0 5px var(--a2),0 6px 10px rgba(0,0,0,.5)}
.g{width:64%;height:64%;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.med.has-art .g{visibility:hidden}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border-radius:inherit}
/* puzzle scene: 100 units tall (10px per unit), as wide as its painting or its pane, panned and zoomed inside the view */
.view{position:relative;overflow:hidden;touch-action:none;background:#1a100a center/cover;cursor:grab}
.scene{position:absolute;left:0;top:0;height:1000px;overflow:hidden;transform-origin:0 0}
.shift{position:absolute;top:0;height:100%}
.shift>.bg,.shift>svg{position:absolute;inset:0;width:100%;height:100%}
.item{position:absolute}
.item small{position:absolute;left:50%;top:100%;transform:translateX(-50%);font-size:14px;white-space:nowrap;color:#000;background:#fff;border-radius:6px;padding:0 4px}
.chip{position:relative;display:grid;place-items:center;width:100%;height:100%;border-radius:28%;color:#fff;
  background:hsl(var(--h) 55% 42%) center/cover;border:.07em solid #fff;box-shadow:0 .1em 0 rgba(0,0,0,.35)}
.chip b{line-height:1}
.chip.has-art{background:none;border-color:transparent;box-shadow:none}
.chip.has-art .art{filter:drop-shadow(0 .05em .04em rgba(0,0,0,.5))}
/* An item placed in a painting: bottom-aligned on its surface, shaded by the painting's light (sprite() sets the vars) */
.chip.in{place-items:end center;filter:brightness(var(--lt))}
.chip.in .art{filter:none;width:100%;height:100%;object-fit:contain;object-position:50% 100%;position:absolute;left:0;top:0}
.chip.in::before{content:'';position:absolute;left:50%;bottom:0;width:calc(var(--sw) * 1.15);height:12%;transform:translate(-50%,50%);
  border-radius:50%;background:var(--ink);filter:blur(.07em);opacity:.35;mix-blend-mode:multiply}
.chip.in.flip .art,.chip.in.flip .glow{transform:scaleX(-1)}
.chip.in .glow{position:absolute;inset:0;background:var(--tint);mix-blend-mode:soft-light;opacity:.55;pointer-events:none;
  -webkit-mask:var(--m) 50% 100%/contain no-repeat;mask:var(--m) 50% 100%/contain no-repeat}
.chip.crop{border-color:var(--a1)}
/* SAMPLE placeholder shapes: an item without a sprite is a coloured shape with its first letter */
.s1{border-radius:50%}
.s2{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.s3{clip-path:polygon(50% 0,100% 100%,0 100%)}
.s4{clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.s5{clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.s6{clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%)}
.s7{clip-path:polygon(33% 0,67% 0,67% 33%,100% 33%,100% 67%,67% 67%,67% 100%,33% 100%,33% 67%,0 67%,0 33%,33% 33%)}
.s3 b,.s5 b{font-size:.6em;transform:translateY(25%)}
.shade .chip{filter:brightness(0);opacity:.82}
.shade .chip b{visibility:hidden}
.patch{position:absolute;-webkit-mask-image:radial-gradient(closest-side,#000 72%,transparent);mask-image:radial-gradient(closest-side,#000 72%,transparent)}
.hintring{position:absolute;border:8px dashed var(--gold);border-radius:50%;pointer-events:none;animation:beat .6s infinite alternate}
@keyframes beat{to{transform:scale(1.12)}}
.hinted{animation:beat .5s infinite alternate;box-shadow:0 0 0 6px var(--gold) !important}
.verdict{position:absolute;right:-8%;top:-8%;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:#5b4a3c;color:#fff;z-index:2}
.verdict.yes{background:var(--gold);color:#3a2618}
.verdict .g{stroke-width:6}
.toast{position:fixed;left:50%;top:16px;z-index:30;transform:translateX(-50%);padding:10px 26px;border-radius:999px;font-weight:bold;pointer-events:none;
  border:3px solid var(--gold);background:var(--panel);animation:toast 2.2s both}
@keyframes toast{0%,100%{opacity:0}12%,80%{opacity:1}}
.bar{display:flex;align-items:center;gap:14px;padding:12px 16px}
.bar h1{flex:1;font-size:24px}
.mb{position:relative;display:inline-flex;flex-direction:column;align-items:center;gap:7px;min-width:64px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:8px 22px;border-radius:999px;font-weight:bold;text-align:left;
  border:3px solid var(--a1);background:linear-gradient(#5d3f27,#38241a);box-shadow:0 4px 0 #120b07,0 8px 12px rgba(0,0,0,.4)}
.pill:active:not(:disabled),.mb:active:not(:disabled) .med{transform:translateY(2px)}
button:disabled{opacity:.45;cursor:default}
.pill small{display:block;font-size:13px;font-weight:normal;opacity:.85}
.num{font-size:24px;font-weight:bold}
  border:3px solid var(--a1);background:var(--panel);box-shadow:inset 0 0 0 3px var(--a2),0 6px 12px rgba(0,0,0,.4)}
.cat{width:100%;padding:14px;border-radius:30px;background:var(--panel);box-shadow:inset 0 0 0 3px var(--a2)}
.nums{display:grid;grid-template-columns:repeat(auto-fit,84px);gap:26px;justify-content:center;max-width:572px;margin:auto;padding:24px}
/* a round in progress: its count under the number, and a small two-tap reset medallion on the tile */
.cell{position:relative;display:grid}
.cell small{width:84px;text-align:center}
.reset{position:absolute;right:-12px;top:-12px}
.reset .med{width:36px;height:36px;border-width:2px}
.reset.armed .med{color:var(--gold);border-color:var(--gold)}
/* play: the stage plus a side sheet (landscape) or bottom sheet (portrait) holding the clue, the powers and the Found Tray */
.playing #app{bottom:0}
.play{display:grid;height:100%;grid-template-columns:1fr auto}
.side{position:relative;display:flex;flex-direction:column;gap:8px;width:264px;min-height:0;overflow:hidden;padding:8px 8px 84px;background:var(--panel)}
.side .bar{padding:0 52px 4px 0}
.side h1{font-size:18px}
.side .med{width:44px;height:44px}
#list{flex:none;margin:0;padding:0;list-style:none;columns:2;font-size:13px}
#list li{display:flex;align-items:center;gap:3px;padding:2px 0;break-inside:avoid}
#list .g{flex:none;width:13px;height:13px;stroke-width:6;color:var(--gold);visibility:hidden}
#list .chip{flex:none;width:20px;height:20px;font-size:12px}
#list .done{color:#a8977c;text-decoration:line-through}
#list .done .g{visibility:visible}
#clue{display:grid;gap:8px;justify-items:start;font-size:16px}
#clue .riddle{padding:8px 14px;border-radius:18px;background:#1c120c;font-style:italic}
#clue .pill{min-height:40px;padding:4px 16px;font-size:14px}
.lens{display:block;width:150px;height:150px;border-radius:50%;overflow:hidden;border:4px solid var(--gold);box-shadow:0 0 0 4px var(--a2)}
.lens .chip{border:0;border-radius:0}
.tray{flex:1;min-height:0;overflow:auto;padding:8px;border-radius:20px;border:3px solid var(--a1);background:#1c120c;box-shadow:inset 0 0 0 3px var(--a2)}
.tray h2{font-size:16px;margin-bottom:6px}
#tray{display:flex;flex-wrap:wrap;gap:6px 2px}
.got{display:flex;flex-direction:column;align-items:center;gap:2px;width:56px;font-size:11px;line-height:1.1;text-align:center}
.got .chip{width:38px;height:38px;font-size:22px}
/* the power toolbar: the same five slots on every home and in play, growing as machines are finished */
.powers{display:flex;align-items:flex-start;gap:6px}
.powers .mb{min-width:46px;font-size:10px;gap:3px;text-align:center;line-height:1}
.powers .med{width:38px;height:38px;border-width:2px;box-shadow:none}
.powers .off .med{border-style:dashed;opacity:.5}
.powers .armed .med{color:var(--gold);border-color:var(--gold)}
/* the sheet's one toggle: the count row. Slimmed, it is all that stays: count, next thing to find, chevron medallion */
.slim{display:flex;align-items:center;gap:8px;text-align:left}
.slim .med{position:absolute;right:8px;top:8px}
#next{display:none}
.slimmed .side{width:84px;padding:8px}
.slimmed .side>:not(.slim),.peeking .side{display:none}
.slimmed .slim{flex-direction:column;font-size:14px;text-align:center}
.slimmed .slim .med{position:static;order:-1}
.slimmed .slim .g{transform:rotate(180deg)}
.slimmed #next{display:block}
.pulse{animation:pulse .5s}
@keyframes pulse{40%{transform:scale(1.08);color:var(--gold)}}
/* Compare It: the two pictures side by side on wide screens, one at a time with a switch on narrow ones */
.duo{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:6px;min-width:0;min-height:0}
.tag{position:absolute;left:10px;top:10px;z-index:3;padding:2px 14px;border-radius:999px;background:var(--panel);border:2px solid var(--a1);font-size:13px;pointer-events:none}
.flipper{display:none;position:absolute;left:50%;bottom:10px;z-index:4;transform:translateX(-50%)}
/* tray rounds and picture choices: big round-cornered badges */
.flat{cursor:default;touch-action:manipulation}
.cards{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:16px;background:rgba(20,12,8,.74)}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:16px}
.card{position:relative;display:block;width:clamp(84px,17vw,150px);aspect-ratio:1;padding:12px;border-radius:26%;font-size:clamp(34px,7vw,64px);
  border:3px solid var(--a1);background:var(--cream);box-shadow:0 0 0 3px var(--wood),0 0 0 6px var(--a2),0 8px 14px rgba(0,0,0,.5)}
.card.show{border-color:var(--gold)}
#over{position:absolute;inset:0;pointer-events:none}
#over>*{pointer-events:auto}
.peekbar{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:6px 8px 6px 22px;border-radius:999px;
  background:var(--panel);border:3px solid var(--gold);white-space:nowrap}
.curtain{position:absolute;inset:0;background:var(--wood);animation:curtain 1s both}
@keyframes curtain{0%{opacity:0}45%,55%{opacity:1}100%{opacity:0}}
.choices{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:16px}
.choices .card{width:clamp(76px,13vw,120px);font-size:clamp(30px,5vw,50px)}
@media (orientation:portrait){
  .play{grid-template-columns:none;grid-template-rows:1fr auto}
  .side,.slimmed .side{width:auto;padding:8px}
  #list{columns:4}
  .tray{min-height:84px;margin-right:76px}
  .slim .g{transform:rotate(90deg)}
  .slimmed .side{padding-bottom:max(8px,env(safe-area-inset-bottom))}
  .slimmed .slim{flex-direction:row;font-size:inherit;text-align:left}
  .slimmed .slim .med{order:0}
  .slimmed .slim .g{transform:rotate(-90deg)}
  .slimmed #next{flex:1}
  .duo{grid-template-columns:1fr}
  .duo #view2,.flip .duo #view{display:none}
  .flip .duo #view2,.flipper{display:block}
  .home .bar{flex-wrap:wrap;gap:6px 14px}
  .stagew{padding:0 4px;gap:2px}
  .stagew>.mb{min-width:0}
  .stagew>.mb span:not(.med){display:none}
  .stagew>.mb .med{width:34px;height:34px;border-width:2px}
}
/* found sequence: golden ring draws itself, pop and sparkles, then the thing goes to the tray */
.ring{position:absolute;left:-20%;top:-20%;width:140%;height:140%;overflow:visible;pointer-events:none}
.ring circle{fill:none;stroke:var(--gold);stroke-width:9;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;animation:draw .35s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pop .chip{animation:pop .4s}
@keyframes pop{40%{transform:scale(1.3)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7%)}50%{transform:translateX(7%)}75%{transform:translateX(-4%)}}
.fly{position:fixed;z-index:9;transform-origin:0 0;transition:transform .5s ease-in}
.sparks{position:absolute;left:50%;top:50%;pointer-events:none}
.sparks i{position:absolute;left:-7px;top:-7px;width:14px;height:14px;background:var(--gold);--d:-70px;animation:spark .7s ease-out both;
  clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
@keyframes spark{from{transform:rotate(var(--r));opacity:0}15%{opacity:1}to{transform:rotate(var(--r)) translateY(var(--d)) scale(.2);opacity:0}}
.win{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(20,12,8,.8)}
.card.note,.wincard{display:grid;gap:16px;justify-items:center;padding:28px 36px;border-radius:36px;text-align:center;
  border:4px solid var(--gold);background:var(--panel);box-shadow:0 0 60px rgba(255,201,40,.4)}
.wincard b{color:var(--gold)}
/* settings */
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;padding:8px 16px 24px}
.sets h2{margin-bottom:12px}
.sets .pill{margin:0 10px 6px 0}
.code{margin-bottom:12px;font-size:13px;word-break:break-all;-webkit-user-select:all;user-select:all}
.field{width:100%;min-height:48px;margin-bottom:12px;padding:8px 18px;border-radius:999px;border:3px solid var(--a2);
  background:#1c120c;color:var(--cream);font:inherit;-webkit-user-select:text;user-select:text}
.slider{-webkit-appearance:none;appearance:none;width:min(100%,420px);height:22px;margin:14px 0;border-radius:999px;
  border:3px solid var(--a1);background:#1c120c;box-shadow:inset 0 0 0 2px var(--a2)}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:44px;height:44px;border-radius:50%;border:3px solid var(--a1);
  background:radial-gradient(circle at 35% 30%,#ffe08a,#b9812a);box-shadow:0 0 0 3px var(--wood),0 0 0 5px var(--a2),0 4px 8px rgba(0,0,0,.5)}
.slider::-moz-range-thumb{width:40px;height:40px;border-radius:50%;border:3px solid var(--a1);
  background:radial-gradient(circle at 35% 30%,#ffe08a,#b9812a);box-shadow:0 0 0 3px var(--wood),0 0 0 5px var(--a2),0 4px 8px rgba(0,0,0,.5)}
.toggle{position:relative;display:flex;align-items:center;width:136px;height:64px;padding:0 6px;border-radius:999px;
  border:3px solid var(--a1);background:#1c120c;box-shadow:inset 0 0 0 3px var(--a2),0 6px 10px rgba(0,0,0,.4)}
.toggle .med{width:46px;height:46px;color:#8d7c66;border-color:#8d7c66;transition:transform .2s}
.toggle b{position:absolute;right:20px}
.toggle[aria-checked=true]{background:linear-gradient(#6f9440,#3f5f22)}
.toggle[aria-checked=true] .med{transform:translateX(72px);color:var(--gold);border-color:var(--gold)}
.toggle[aria-checked=true] b{left:20px;right:auto}
.toggle[aria-checked=false] .med::after{content:"";position:absolute;width:3px;height:74%;border-radius:2px;background:currentColor;transform:rotate(45deg)}
.toggle.has-art{border:0;background:none;box-shadow:none}
.toggle.has-art>:not(.art){visibility:hidden}
.test{max-width:900px;max-height:92%;overflow:auto;text-align:left;justify-items:start;-webkit-user-select:text;user-select:text}
.test ul{margin:0;padding:0;list-style:none}
.test li{padding:3px 0}
.test .ok b{color:#9bdc74}
.test .bad b{color:#ff9478}
/* ---------- the atelier: title, room, world menus, machines ---------- */
#title,#room{position:fixed;inset:0;overflow:hidden;background:#1d1424;display:none;touch-action:none}
[data-screen=title] #title{display:block}
#room{animation:fadein .6s}
[data-screen=home] #room,[data-screen=modes] #room,[data-screen=stages] #room,[data-screen=machine] #room,[data-screen=settings] #room{display:block}
body:not([data-screen=play]) #app{pointer-events:none}
body:not([data-screen=play]) #app>*{pointer-events:auto}
[data-screen=machine] #room>*,[data-screen=settings] #room>*{filter:brightness(.55) blur(1px);transition:filter .3s}
[data-screen=modes] #room>button,[data-screen=stages] #room>button,[data-screen=modes] .papers,[data-screen=stages] .papers{display:none}
.tcam,#rcam{position:absolute;left:0;top:0;transform-origin:0 0}
.tcam{width:1200px;height:896px;clip-path:inset(0 -197px)}
.tcam .tbg{position:absolute;inset:0 -196.2px;width:1592.4px;height:100%;max-width:none}
.tcam>div,#rcam .o{position:absolute}
.tcam img,#rcam .o>img{display:block;width:100%;height:100%;pointer-events:none}
#rcam .o>.inhole{position:absolute;object-fit:cover}
.hot{cursor:pointer}
.t-sign{filter:drop-shadow(0 6px 6px rgba(0,0,0,.45))}
.t-win{overflow:hidden;border-radius:50%}
.t-win img{translate:0 105%;transition:translate .7s}
.t-win::before,.t-win::after{content:"";position:absolute;background:#b07a45;box-shadow:0 0 0 1.5px #2b170c;opacity:0;transition:opacity .3s}
.t-win::before{left:calc(50% - 4.5px);top:0;width:9px;height:100%}
.t-win::after{top:calc(50% - 4.5px);left:0;height:9px;width:100%}
.tt-owl .t-win img,.tt-witch .t-win img{translate:0 12%}
.tt-owl .t-win::before,.tt-owl .t-win::after,.tt-witch .t-win::before,.tt-witch .t-win::after{opacity:1}
.t-rabbit{animation:fadein .5s}
.tt-rabbit .t-rabbit{animation:rabbitrun 2.5s ease-in forwards}
.tt-rabbit .t-rabbit img{scale:-1 1;animation:hop .42s 6}
@keyframes rabbitrun{to{translate:-560px 0}}
.tt-owl .t-owl{animation:hop .5s 2}
.t-frog{animation:fadein .5s}
.tt-frogjump .t-frog{animation:none;opacity:0}
.t-fjump,.t-kjump,.t-splash,.t-ripple{opacity:0;pointer-events:none}
.tt-frogjump .t-fjump{animation:frogjump .75s ease-in both}
.tt-frogjump .t-splash,.tt-koijump .t-splash{animation:splash .7s .68s both}
.tt-frogjump .t-ripple,.tt-koijump .t-ripple{animation:ripple 1.5s .8s both}
.tt-koijump .t-kjump{animation:koijump .8s both}
.t-koi{opacity:.8;pointer-events:none;animation:koi 14s linear infinite}
.t-koi.k2{animation-duration:19s;animation-delay:-7s}
@keyframes koi{0%{translate:0 0;rotate:80deg}45%{translate:70px 14px;rotate:100deg}50%{translate:74px 16px;rotate:260deg}95%{translate:4px 2px;rotate:280deg}100%{translate:0 0;rotate:440deg}}
@keyframes splash{0%{opacity:0;scale:.3}30%{opacity:1;scale:1}100%{opacity:0;scale:1.15}}
@keyframes ripple{0%{opacity:0;scale:.3}25%{opacity:.8}100%{opacity:0;scale:1.3}}
@keyframes koijump{0%{opacity:1;translate:0 30px;rotate:-30deg}45%{opacity:1;translate:25px -50px;rotate:40deg}85%{opacity:1;translate:55px 20px;rotate:130deg}100%{opacity:0;translate:58px 30px;rotate:140deg}}
.t-dragon{animation:dragon 26s linear infinite;opacity:.85}
.t-dragon img{position:absolute;inset:0;opacity:0;animation:frame4 .64s steps(1) infinite}
@keyframes frame4{0%{opacity:1}25%,100%{opacity:0}}
.petal{position:fixed;top:-40px;z-index:5;pointer-events:none;animation:petal var(--t) linear var(--d) both}
.petal img{display:block;animation:flutter 1.3s ease-in-out infinite alternate}
@keyframes petal{to{translate:var(--x) calc(100vh + 80px);rotate:var(--r)}}
@keyframes flutter{from{transform:rotateX(0) translateX(-14px)}to{transform:rotateX(60deg) translateX(14px)}}
.fairies img{position:absolute;width:34px;opacity:0}
.tt-fairydoor .fairies img{animation:fairyout 2.4s ease-out both}
.fairies img:nth-child(1){left:205px;top:690px}
.fairies img:nth-child(2){left:215px;top:700px;animation-delay:.2s !important}
.fairies img:nth-child(3){left:200px;top:700px;animation-delay:.4s !important}
.frontdoor{position:absolute;left:556px;top:466px;width:108px;height:247px;perspective:700px}
.door3d{position:absolute;inset:0;transform-origin:0 50%;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.5,0,.3,1)}
.door3d .face{position:absolute;inset:0;width:100%;height:100%}
.door3d i{position:absolute;inset:0;border-radius:54px 54px 0 0/70px 70px 0 0;background:#3a2238}
.door3d i:nth-child(n+6):nth-child(-n+7){background:#c9a24a}
.door3d i:nth-child(1){transform:translateZ(-24px)}.door3d i:nth-child(2){transform:translateZ(-22px)}.door3d i:nth-child(3){transform:translateZ(-20px)}

  world('micro-kingdoms', "Micro-Kingdoms: The Giant's Living Room", 'You are three inches tall in a messy, giant room.'),
  world('papercraft-origami-kingdom', 'The Papercraft and Origami Kingdom', 'A pop-up land of folded paper and cardboard.'),
  world('grand-astral-express', 'The Grand Astral Express', 'A velvet-and-brass train rolling through the stars.'),
  world('living-art-gallery', 'The Living Art Gallery', 'A storybook museum where the paintings are alive.'),
  world('sunken-coral-metropolis', 'Sunken Coral Metropolis', 'Sunny underwater ruins with turtles and pearl lanterns.'),

// ---------- MACHINES: the five Wonder Machines in SPEC order; a1/a2 are each home's accent colours ----------
const MACHINES = [
  { id: 'wind-up-robot', name: 'Wind-up Robot', a1: '#e0b455', a2: '#8a5a34' },
  { id: 'puzzle-box', name: 'Puzzle Box', a1: '#eb9a72', a2: '#7d3f52' },
  { id: 'terrarium', name: 'Terrarium', a1: '#a6d68f', a2: '#3f7a5a' },
  { id: 'astral-clock', name: 'Astral-Clock', a1: '#a9bdff', a2: '#4a4f9a' },
  { id: 'wallpaper-art-odyssey', name: 'Wallpaper Art Odyssey', a1: '#f2a8cc', a2: '#7a4a8a' }

// POWERS: which power each finished machine grants. Change the mapping here and nowhere else.
const POWERS = { 'wind-up-robot': 'zoom', terrarium: 'hint', 'astral-clock': 'echo', 'puzzle-box': 'scanner', 'wallpaper-art-odyssey': 'shield' };
const TIME = { hold: 600, fly: 500, peek: 10000, curtain: 500, echo: 3000 }; // feedback and memory timings, in ms

// ---------- Seeded dealing: a sub-stage's id (world / mode / 1..10) is its seed, frozen forever ----------
function hash(str) { // FNV-1a, 32-bit

// PICKING (frozen): put() and fill() decide WHICH things a round deals, exactly as they always have; where those things
// finally stand is decided afterwards by seat(). Changing put() or fill() would change every round's items.
// Puts one item in a random zone that has room: it shrinks to the zone's size limit and sprite scale. False after 200 tries.
// A zone says where an item's BASE may touch: a rest zone is a ledge (the base sits on its bottom edge), any other

// Compare It and Remember It play in one 90-unit-wide pane of the painting, so two pictures fit side by side.

  'i-spy'(r, rnd, cast) { fill(r, rnd, cast, 5, 18); r.ordered = true; },
  count(r, rnd, cast) { // placed multiples of one item

  twins(r, rnd, cast) { // the only mode that places both members of a twin pair; their look-alike family comes along as decoys

  zoom(r, rnd, cast) { // three painted objects, one at a time, each shown as a close-up

// ---------- Seating: where each dealt thing stands, so it belongs in the painting (the owner's embedding rules) ----------
// 1 Surface only: its base on a zone's surface line (ledge) or inside its patch (ground), wholly inside the zone, the
//   scene and clear of every other thing; never over a painted object or character (at most a fifth of it, or of the
//   thing itself, may overlap).
// 2 Replace first: a thing with a swappable painted twin stands exactly over it (same centre, same footprint).
// 3 Scale from neighbours: its height is the median height of the painted things beside it on that surface, x0.8 (S),
//   x1 (M) or x1.2 (L) (wide things lower, never under x0.75), always inside the owner's +-25% band; never above the

    `<img src="${ui('room/props-books', 9 + Math.floor(Math.random() * 2))}" alt="" draggable="false"></div>`);

// Pets: tapping one plays its next move (surprised, happy, its own trick); tapping near one makes it look.

// Life in the room: photos change pose, the cat strolls, fish swim (CSS); every few seconds something wiggles.
function roomLife() {
  if (cur.screen !== 'home' || document.hidden) return;
  const photos = $$('[data-swap]'), ph = photos[Math.floor(Math.random() * photos.length)];
  if (ph) { const a = ph.src, b = ph.dataset.swap; ph.src = new URL(b, location.href).href; ph.dataset.swap = a; }
  const hots = $$('#room .hot:not(.pet)'), w = hots[Math.floor(Math.random() * hots.length)];
  if (w) { w.classList.remove('wiggle'); void w.offsetWidth; w.classList.add('wiggle'); }

  const dr = $('#o-pet-dragon'); // the dragon lives in the air: it flies from spot to spot under the beams, nose first
  if (dr && !dr.classList.contains('acting') && Math.random() < .6) {
    const from = parseFloat(dr.style.left), x = Math.max(150, Math.min(RW - 300, from + Math.random() * 1800 - 900));
    dr.style.scale = x < from ? '-1 1' : '1 1';

    if (!cat.classList.contains('acting')) img.src = ui('pets/cat', PETS.cat.idle); }, ms);

// The room guide (no words, no arrows): until a world has ever been opened, the cat walks to the world nearest to it

  const id = WORLDS.map(w => w.id).filter(id => first || !save.progress.worlds[id] && id !== cur.world)
    .sort((a, b) => Math.abs(placed[worldSpot(a)].x - mid) - Math.abs(placed[worldSpot(b)].x - mid))[0];
  if (!id) return guided.once = false;
  const to = Math.max(40, Math.min(RW - cw - 40, placed[worldSpot(id)].x - cw - 30)); // beside the world, on the floor
  if (Math.abs(to - left) > 8) catWalk(to);

function trainLoop(t) { // three toy cars run round the oval track on the table

let armed = ''; // which two-tap confirm is waiting for its second tap
// Music: one looping audio element, so tracks can never overlap. Home screens and menus play home.m4a, a world's
// puzzles play that world's track. Sound may only start after the first tap (browser autoplay rule).
const music = $('#music');
let audioOn = false, gain = null;
music.volume = .5;
const fixedVolume = music.volume !== .5; // iPad and iPhone ignore audio.volume: the slider drives a gain node there
function tune() {
  const src = cur.screen === 'play' ? `assets/music/world-${String(WORLDS.findIndex(w => w.id === cur.world) + 1).padStart(2, '0')}-${cur.world}.m4a` : 'assets/music/home.m4a';
  if (music.getAttribute('src') !== src) music.src = src;
  if (audioOn && save.settings.music) music.play().catch(() => {}); else music.pause();
}
function applyAudio() {
  music.volume = save.settings.volume / 100;
  music.muted = !save.settings.music;
  if (gain) gain.gain.value = save.settings.volume / 100;

}
addEventListener('pointerdown', () => {

}, { once: true });
// Save code, house format: CC1-<base64url(save JSON)>-<FNV-1a checksum>. The whole save travels: machines, powers,
// cleared and unlocked sub-stages, rounds in progress and settings.
function exportCode() {
  const body = btoa(JSON.stringify(save)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  return `CC1-${body}-${hash(body).toString(36)}`;
}
function readCode(code) { // validates prefix, checksum, JSON shape and version; returns a save or null and never writes
  const m = /^CC1-([\w-]+)-([a-z0-9]+)$/.exec(code.trim());

  try {
    const s = JSON.parse(atob(m[1].replace(/-/g, '+').replace(/_/g, '/')));
    return validSave(s) ? migrate(s) : null;
  } catch (e) { return null; }
}

const ACT = {

  machine(i) { if (MACHINES[i]) { cur.home = +i; show('machine'); } },

    document.body.classList.toggle('slimmed');
