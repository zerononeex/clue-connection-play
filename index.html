<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Clue Connection</title>
<style>
:root{--wood:#241710;--panel:#33231a;--cream:#f6ecd6;--gold:#ffc928;--a1:#e0b455;--a2:#8a5a34;--nav:84px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--wood);color:var(--cream);font:17px/1.3 Calibri,Arial,Helvetica,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3,p{margin:0}
#app{position:fixed;inset:0 0 calc(var(--nav) + env(safe-area-inset-bottom)) 0;overflow:auto}
/* shaped controls: medallions and pills, never plain rectangles */
.med{position:relative;display:grid;place-items:center;flex:none;width:56px;height:56px;border-radius:50%;color:var(--a1);
  background:radial-gradient(circle at 35% 30%,#6b4a2e,#2a1a10);border:3px solid var(--a1);
  box-shadow:0 0 0 3px var(--wood),0 0 0 5px var(--a2),0 6px 10px rgba(0,0,0,.5)}
.g{width:64%;height:64%;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.med.has-art .g{visibility:hidden}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border-radius:inherit}
/* puzzle scene: a 200 x 100 unit world (10px per unit) panned and zoomed inside the view */
.view{position:relative;overflow:hidden;touch-action:none;background:#1a100a;cursor:grab}
.scene{position:absolute;left:0;top:0;width:2000px;height:1000px;transform-origin:0 0}
.scene>svg,.scene>.art{position:absolute;inset:0;width:100%;height:100%;border-radius:0;object-fit:fill}
.item{position:absolute}
.item small{position:absolute;left:50%;top:100%;transform:translateX(-50%);font-size:14px;white-space:nowrap;color:#000;background:#fff;border-radius:6px;padding:0 4px}
.chip{position:relative;display:grid;place-items:center;width:100%;height:100%;border-radius:28%;color:#fff;
  background:hsl(var(--h) 55% 42%);border:.07em solid #fff;box-shadow:0 .1em 0 rgba(0,0,0,.35)}
.chip b{line-height:1}
.chip.has-art{background:none;border-color:transparent;box-shadow:none}
.chip.has-art b{visibility:hidden}
.bar{display:flex;align-items:center;gap:14px;padding:12px 16px}
.bar h1{flex:1;font-size:24px}
.mb{position:relative;display:inline-flex;flex-direction:column;align-items:center;gap:7px;min-width:64px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:8px 22px;border-radius:999px;font-weight:bold;text-align:left;
  border:3px solid var(--a1);background:linear-gradient(#5d3f27,#38241a);box-shadow:0 4px 0 #120b07,0 8px 12px rgba(0,0,0,.4)}
.pill:active:not(:disabled),.mb:active:not(:disabled) .med{transform:translateY(2px)}
button:disabled{opacity:.45;cursor:default}
.pill small,.tile small{display:block;font-size:13px;font-weight:normal;opacity:.85}
.num{font-size:24px;font-weight:bold}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding:8px 16px 24px}
.tile{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:30px;text-align:left;
  border:3px solid var(--a1);background:var(--panel);box-shadow:inset 0 0 0 3px var(--a2),0 6px 12px rgba(0,0,0,.4)}
.cats{display:grid;gap:14px;justify-items:start;padding:8px 16px 24px}
.cat{width:100%;padding:14px;border-radius:30px;background:var(--panel);box-shadow:inset 0 0 0 3px var(--a2)}
.cathead{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.cathead .med{width:76px;height:76px}
.modes{display:flex;flex-wrap:wrap;gap:12px}
.mode{padding-left:8px}
.mode .med{width:40px;height:40px;border-width:2px;box-shadow:none}
.nums{display:grid;grid-template-columns:repeat(auto-fit,84px);gap:26px;justify-content:center;max-width:572px;margin:auto;padding:24px}
.nums .med{width:84px;height:84px;font-size:34px}
.tick{position:absolute;right:-6px;top:58px;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--gold);color:#3a2618}
/* a round in progress: its count under the number, and a small two-tap reset medallion on the tile */
.cell{position:relative;display:grid}
.cell small{width:84px;text-align:center}
.reset{position:absolute;right:-12px;top:-12px}
.reset .med{width:36px;height:36px;border-width:2px}
.reset.armed .med{color:var(--gold);border-color:var(--gold)}
/* play: scene plus a side sheet (landscape) or bottom sheet (portrait) holding the checklist and the Found Tray */
.playing #app{bottom:0}
.play{display:grid;height:100%;grid-template-columns:1fr auto}
.side{position:relative;display:flex;flex-direction:column;gap:8px;width:264px;min-height:0;overflow:hidden;padding:8px 8px 84px;background:var(--panel)}
.side .bar{padding:0 52px 4px 0}
.side h1{font-size:18px}
.side .med{width:44px;height:44px}
#list{flex:none;margin:0;padding:0;list-style:none;columns:2;font-size:14px}
#list li{display:flex;align-items:center;gap:3px;padding:2px 0;break-inside:avoid}
#list .g{flex:none;width:15px;height:15px;stroke-width:6;color:var(--gold);visibility:hidden}
#list .done{color:#a8977c;text-decoration:line-through}
#list .done .g{visibility:visible}
.tray{flex:1;min-height:0;overflow:auto;padding:8px;border-radius:20px;border:3px solid var(--a1);background:#1c120c;box-shadow:inset 0 0 0 3px var(--a2)}
.tray h2{font-size:16px;margin-bottom:6px}
#tray{display:flex;flex-wrap:wrap;gap:6px 2px}
.got{display:flex;flex-direction:column;align-items:center;gap:2px;width:56px;font-size:11px;line-height:1.1;text-align:center}
.got .chip{width:38px;height:38px;font-size:22px}
/* the sheet's one toggle: the count row. Slimmed, it is all that stays: count, next item to find, chevron medallion */
.slim{display:flex;align-items:center;gap:8px;text-align:left}
.slim .med{position:absolute;right:8px;top:8px}
#next{display:none}
.slimmed .side{width:84px;padding:8px}
.slimmed .side>:not(.slim),.slimmed #nav{display:none}
.slimmed .slim{flex-direction:column;font-size:14px;text-align:center}
.slimmed .slim .med{position:static;order:-1}
.slimmed .slim .g{transform:rotate(180deg)}
.slimmed #next{display:block}
.pulse{animation:pulse .5s}
@keyframes pulse{40%{transform:scale(1.08);color:var(--gold)}}
@media (orientation:portrait){
  .play{grid-template-columns:none;grid-template-rows:1fr auto}
  .side,.slimmed .side{width:auto;padding:8px}
  #list{columns:4}
  .tray{min-height:104px;margin-right:76px}
  .slim .g{transform:rotate(90deg)}
  .slimmed .side{padding-bottom:max(8px,env(safe-area-inset-bottom))}
  .slimmed .slim{flex-direction:row;font-size:inherit;text-align:left}
  .slimmed .slim .med{order:0}
  .slimmed .slim .g{transform:rotate(-90deg)}
  .slimmed #next{flex:1}
}
/* found sequence: golden ring draws itself, pop and sparkles, then the item flies to the tray */
.ring{position:absolute;left:-20%;top:-20%;width:140%;height:140%;overflow:visible;pointer-events:none}
.ring circle{fill:none;stroke:var(--gold);stroke-width:9;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;animation:draw .35s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pop .chip{animation:pop .4s}
@keyframes pop{40%{transform:scale(1.3)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7%)}50%{transform:translateX(7%)}75%{transform:translateX(-4%)}}
.fly{position:fixed;z-index:9;transform-origin:0 0;transition:transform .5s ease-in}
.sparks{position:absolute;left:50%;top:50%;pointer-events:none}
.sparks i{position:absolute;left:-7px;top:-7px;width:14px;height:14px;background:var(--gold);--d:-70px;animation:spark .7s ease-out both;
  clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
@keyframes spark{from{transform:rotate(var(--r));opacity:0}15%{opacity:1}to{transform:rotate(var(--r)) translateY(var(--d)) scale(.2);opacity:0}}
.win{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(20,12,8,.8)}
.card{display:grid;gap:16px;justify-items:center;padding:28px 36px;border-radius:36px;text-align:center;
  border:4px solid var(--gold);background:var(--panel);box-shadow:0 0 60px rgba(255,201,40,.4)}
/* Wonder Machine home: a living room scene that changes with every piece */
.home{display:flex;flex-direction:column;height:100%}
.powers{display:flex;align-items:center;gap:10px}
.powers .med{width:40px;height:40px;border-style:dashed;opacity:.55}
.stagew{flex:1;display:flex;align-items:center;gap:6px;min-height:0;padding:0 10px}
.room{flex:1;min-width:0;height:100%;touch-action:pan-y}
.wire{fill:none;stroke:#5b4636;stroke-width:.6}
.bulb{fill:#4a3a2e}
.bulb.lit{fill:#ffe08a;filter:drop-shadow(0 0 2px #ffd76a)}
.piece{fill:none;stroke:#e0b455;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.piece .wood{stroke:#9a6638;stroke-width:3.4}
.ghost,.ghost .wood{fill:none;stroke:#f6ecd6;stroke-width:1;stroke-dasharray:2 2;opacity:.25}
.piece.fly{animation:flyin .9s cubic-bezier(.3,1.3,.5,1) both;transform-box:fill-box;transform-origin:center}
@keyframes flyin{from{transform:translateY(-70px) scale(2.4);opacity:0}70%{opacity:1}}
.spk{fill:var(--gold);--d:-16px;animation:spark .7s .7s ease-out both}
.marble{fill:var(--gold);stroke:#fff;stroke-width:.6}
.runs{animation:hum 1.2s ease-in-out infinite alternate}
@keyframes hum{to{filter:drop-shadow(0 0 3px #ffd76a)}}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px 14px}
.foot b{color:var(--gold)}
.big{padding:10px 44px;font-size:22px}
/* the bottom banner: the same five medallions in landscape and portrait; one Home medallion during play */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:space-around;align-items:center;
  height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:linear-gradient(#3a2618,#1b110a);border-top:3px solid var(--a2);box-shadow:0 -4px 12px rgba(0,0,0,.5)}
#nav .mb{gap:6px;font-size:12px}
#nav .med{width:46px;height:46px}
.playing #nav{left:auto;right:10px;bottom:10px;height:auto;padding:0;background:none;border:0;box-shadow:none}
/* settings */
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;padding:8px 16px 24px}
.sets h2{margin-bottom:12px}
.sets .pill{margin:0 10px 6px 0}
.code{margin-bottom:12px;font-size:13px;word-break:break-all;-webkit-user-select:all;user-select:all}
.field{width:100%;min-height:48px;margin-bottom:12px;padding:8px 18px;border-radius:999px;border:3px solid var(--a2);
  background:#1c120c;color:var(--cream);font:inherit;-webkit-user-select:text;user-select:text}
.slider{-webkit-appearance:none;appearance:none;width:min(100%,420px);height:22px;margin:14px 0;border-radius:999px;
  border:3px solid var(--a1);background:#1c120c;box-shadow:inset 0 0 0 2px var(--a2)}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:44px;height:44px;border-radius:50%;border:3px solid var(--a1);
  background:radial-gradient(circle at 35% 30%,#ffe08a,#b9812a);box-shadow:0 0 0 3px var(--wood),0 0 0 5px var(--a2),0 4px 8px rgba(0,0,0,.5)}
.slider::-moz-range-thumb{width:40px;height:40px;border-radius:50%;border:3px solid var(--a1);
  background:radial-gradient(circle at 35% 30%,#ffe08a,#b9812a);box-shadow:0 0 0 3px var(--wood),0 0 0 5px var(--a2),0 4px 8px rgba(0,0,0,.5)}
.toggle{position:relative;display:flex;align-items:center;width:136px;height:64px;padding:0 6px;border-radius:999px;
  border:3px solid var(--a1);background:#1c120c;box-shadow:inset 0 0 0 3px var(--a2),0 6px 10px rgba(0,0,0,.4)}
.toggle .med{width:46px;height:46px;color:#8d7c66;border-color:#8d7c66;transition:transform .2s}
.toggle b{position:absolute;right:20px}
.toggle[aria-checked=true]{background:linear-gradient(#6f9440,#3f5f22)}
.toggle[aria-checked=true] .med{transform:translateX(72px);color:var(--gold);border-color:var(--gold)}
.toggle[aria-checked=true] b{left:20px;right:auto}
.toggle[aria-checked=false] .med::after{content:"";position:absolute;width:3px;height:74%;border-radius:2px;background:currentColor;transform:rotate(45deg)}
.toggle.has-art{border:0;background:none;box-shadow:none}
.toggle.has-art>:not(.art){visibility:hidden}
.test{max-width:860px;max-height:92%;overflow:auto;text-align:left;justify-items:start;-webkit-user-select:text;user-select:text}
.test ul{margin:0;padding:0;list-style:none}
.test li{padding:3px 0}
.test .ok b{color:#9bdc74}
.test .bad b{color:#ff9478}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<audio id="music" loop></audio>
<script>
'use strict';
// ---------- LABELS: every display name lives here; rename in one line ----------
const LABELS = {
  title: 'Clue Connection',
  cat: { find: 'Find It', compare: 'Compare It', remember: 'Remember It', figure: 'Deduce It' },
  mode: {
    'i-spy': 'I Spy', 'hidden-object': 'Find Them All', count: 'Count Them', twins: 'Find the Twins',
    'spot-difference': 'Spot the Difference', 'odd-one-out': 'Odd One Out', shadow: 'Shadow Match',
    vanished: "What's Missing?", changed: 'What Changed?', 'doesnt-belong': "Which Doesn't Belong?", zoom: 'Tiny Clues'
  },
  ui: {
    play: 'Play', back: 'Back', home: 'Home', settings: 'Settings', soon: 'Coming soon', worlds: 'Pick a World',
    stages: 'Pick a Puzzle', found: 'Found', foundCount: 'found', pieces: 'pieces', powers: 'Powers', runs: 'It runs!',
    later: 'This machine comes later', win: 'You found them all!', newPiece: 'You earned a new piece for the',
    oldPiece: 'You already earned the piece for this puzzle.', seeMachine: 'See my machine', next: 'Next puzzle',
    allModes: 'Show all', resume: 'tap to continue', reset: 'Start this puzzle over', confirmReset: 'Tap again to restart',
    saveCode: 'My Save Code', copy: 'Copy', copied: 'Copied', loadCode: 'Load a Save Code', load: 'Load',
    paste: 'Paste a save code here', badCode: 'That code did not work. Please check it and try again. Your game is unchanged.',
    confirmLoad: 'Tap again to replace your game', loaded: 'Save code loaded.', together: 'Play Together',
    host: 'Host', join: 'Join', volume: 'Volume', music: 'Music', on: 'On', off: 'Off',
    startOver: 'Start Over', confirmWipe: 'Tap again to erase everything', wiped: 'Your game has been reset.'
  }
};

// ---------- ICONS: drop assets/icons/<icon-id>.png in later; the inline SVG is the placeholder ----------
const ICONS = {};
const CATEGORIES = [
  { id: 'find', modes: ['i-spy', 'hidden-object', 'count', 'twins'] },
  { id: 'compare', modes: ['spot-difference', 'odd-one-out', 'shadow'] },
  { id: 'remember', modes: ['vanished', 'changed'] },
  { id: 'figure', modes: ['doesnt-belong', 'zoom'] }
];
const PLAYABLE_MODE = 'hidden-object';
const GLYPHS = {
  find: '<circle cx="21" cy="21" r="10"/><path d="M29 29l10 10"/>',
  compare: '<ellipse cx="15" cy="24" rx="7" ry="9"/><ellipse cx="33" cy="24" rx="7" ry="9"/><circle cx="17" cy="26" r="2.5" fill="currentColor"/><circle cx="35" cy="26" r="2.5" fill="currentColor"/>',
  remember: '<ellipse cx="10" cy="20" rx="6" ry="9"/><ellipse cx="38" cy="20" rx="6" ry="9"/><path d="M17 27a9 9.5 0 1 1 14 0c-2 2-3 4-3 7 0 5 6 6 7 2"/><path d="M17 27c2 2 3 4 3 7 0 6 4 9 9 8"/><circle cx="20.5" cy="19" r="1.5" fill="currentColor"/><circle cx="27.5" cy="19" r="1.5" fill="currentColor"/>',
  figure: '<path d="M5 31c9 6 29 6 38 0"/><path d="M12 32c0-13 3-20 12-20s12 7 12 20"/><path d="M12.5 26c7 3 16 3 23 0"/>',
  settings: '<circle cx="24" cy="24" r="14" stroke-width="5" stroke-dasharray="5.5 5.5"/><circle cx="24" cy="24" r="10"/><circle cx="24" cy="24" r="3.5"/>',
  home: '<path d="M8 24L24 10l16 14"/><path d="M13 21v17h22V21"/><path d="M21 38v-9h6v9"/>',
  back: '<path d="M29 11L16 24l13 13"/>',
  next: '<path d="M19 11l13 13-13 13"/>',
  check: '<path d="M11 25l9 9 17-19"/>',
  lock: '<rect x="13" y="22" width="22" height="16" rx="3"/><path d="M17 22v-5a7 7 0 0 1 14 0v5"/>',
  reset: '<path d="M37 24a13 13 0 1 1-5-10"/><path d="M33 5v10H23"/>',
  note: '<path d="M19 34V14l16-4v20"/><circle cx="15" cy="34" r="4" fill="currentColor"/><circle cx="31" cy="30" r="4" fill="currentColor"/>'
};
for (const id in GLYPHS) ICONS[id] = { src: `assets/icons/${id}.png`, svg: GLYPHS[id] };
for (const c of CATEGORIES) for (const m of c.modes) ICONS[m] = { src: `assets/icons/${m}.png`, svg: GLYPHS[c.id] };

// ---------- WORLDS: zones are in scene units; the scene is 200 wide x 100 tall (1 unit = 1% of scene height) ----------
// Shelf and table zones: items rest on the zone's bottom edge. Wall and floor zones: items sit anywhere inside.
const world = (id, name, blurb, zones = []) => ({ id, name, blurb, background: `assets/worlds/${id}/background.png`, zones });
const zone = (id, x, y, w, h, surface, maxSize) => ({ id, x, y, w, h, surfaces: [surface], maxSize });
const WORLDS = [
  world('clockmakers-attic', "The Clockmaker's Attic", 'A cosy tinker-shop of brass, pendulums and giant cuckoo clocks.', [
    zone('rafter-left', 10, 4, 60, 12, 'shelf', 'M'), zone('rafter-right', 120, 4, 66, 12, 'shelf', 'M'),
    zone('cuckoo-wall', 8, 22, 40, 26, 'wall', 'L'), zone('tool-shelf-top', 54, 22, 44, 13, 'shelf', 'M'),
    zone('tool-shelf-low', 54, 37, 44, 13, 'shelf', 'M'), zone('window-sill', 104, 30, 30, 16, 'shelf', 'M'),
    zone('gear-tower', 140, 20, 22, 30, 'wall', 'L'), zone('pendulum-corner', 166, 22, 28, 28, 'wall', 'L'),
    zone('workbench', 6, 54, 58, 18, 'table', 'L'), zone('blueprint-desk', 72, 56, 48, 16, 'table', 'L'),
    zone('crate-stack', 128, 56, 32, 16, 'table', 'M'), zone('low-shelf', 164, 54, 30, 16, 'shelf', 'M'),
    zone('floor-left', 4, 77, 92, 20, 'floor', 'L'), zone('floor-right', 100, 77, 96, 20, 'floor', 'L')
  ]),
  world('midnight-botanical-conservatory', 'The Midnight Botanical Conservatory', 'A glasshouse at night, full of glowing mushrooms and forest spirits.'),
  world('micro-kingdoms', "Micro-Kingdoms: The Giant's Living Room", 'You are three inches tall in a messy, giant room.'),
  world('papercraft-origami-kingdom', 'The Papercraft and Origami Kingdom', 'A pop-up land of folded paper and cardboard.'),
  world('grand-astral-express', 'The Grand Astral Express', 'A velvet-and-brass train rolling through the stars.'),
  world('living-art-gallery', 'The Living Art Gallery', 'A storybook museum where the paintings are alive.'),
  world('sunken-coral-metropolis', 'Sunken Coral Metropolis', 'Sunny underwater ruins with turtles and pearl lanterns.'),
  world('cloud-top-sky-port', 'The Cloud-Top Sky-Port', 'Floating islands, windmills and airships at cloud piers.'),
  world('wizards-kitchen', "The Wizard's Kitchen and Potion Pantry", 'Bubbling cauldrons, starry jars and enchanted spoons.'),
  world('retro-arcade-toybox', 'Retro Arcade and Toybox Nexus', 'Neon cartridges, toy robots and a giant arcade cabinet.')
];

// ---------- ITEMS ----------
// SAMPLE POOL: 30 placeholder items for the Clockmaker's Attic. The real pool of 80 to 100 items per world
// arrives with the art workbook and replaces this list. These counts are not final.
const SIZE = { S: 5, M: 7, L: 10 }; // item diameter in scene units
const pool = (worldId, rows) => rows.map(([name, category, size], i) => {
  const id = `${worldId}-${String(i + 1).padStart(3, '0')}`;
  return { id, name, category, size, sprite: `assets/worlds/${worldId}/items/${id}.png` };
});
const ITEMS = {
  'clockmakers-attic': pool('clockmakers-attic', [
    ['Brass Gear', 'gears', 'M'], ['Tiny Cog', 'gears', 'S'], ['Coiled Spring', 'gears', 'S'], ['Flywheel', 'gears', 'L'], ['Ratchet Wheel', 'gears', 'M'],
    ['Winding Key', 'keys', 'S'], ['Skeleton Key', 'keys', 'S'], ['Padlock', 'keys', 'M'], ['Key Ring', 'keys', 'M'], ['Keyhole Plate', 'keys', 'S'],
    ['Pocket Watch', 'clocks', 'S'], ['Cuckoo Clock', 'clocks', 'L'], ['Hourglass', 'clocks', 'M'], ['Alarm Clock', 'clocks', 'M'], ['Pendulum Bob', 'clocks', 'L'],
    ['Oil Can', 'tools', 'M'], ['Screwdriver', 'tools', 'M'], ['Magnifier', 'tools', 'M'], ['Tweezers', 'tools', 'S'], ['Wooden Mallet', 'tools', 'L'],
    ['Blueprint Roll', 'papers', 'L'], ['Sketchbook', 'papers', 'M'], ['Ink Pot', 'papers', 'S'], ['Quill Pen', 'papers', 'M'], ['Sealed Envelope', 'papers', 'S'],
    ['Music Box', 'curios', 'L'], ['Candle Stub', 'curios', 'S'], ['Teacup', 'curios', 'S'], ['Spectacles', 'curios', 'M'], ['Brass Bell', 'curios', 'M']
  ])
};

// ---------- MACHINES: the five Wonder Machines in SPEC order; a1/a2 are each home's accent colours ----------
const MACHINES = [
  { id: 'marble-rail', name: 'Marble Rail', a1: '#e0b455', a2: '#8a5a34' },
  { id: 'puzzle-box', name: 'Puzzle Box', a1: '#eb9a72', a2: '#7d3f52',

// ---------- Sub-stage manifest: 10 per world + mode, each just { n, seed }. Seeds are frozen forever. ----------
const subStages = (worldId, modeId) => Array.from({ length: 10 }, (_, i) => ({ n: i + 1, seed: `${worldId}/${modeId}/${i + 1}` }));

// ---------- Seeded generator ----------
function hash(str) { // FNV-1a, 32-bit
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619);
  return h >>> 0;
}
function mulberry32(a) {
  return () => {
    let t = a = a + 0x6D2B79F5 | 0;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
// Returns every placed item for a Hidden Object List round: 20 targets plus the rest of the pool as decoys.
// Positions come only from the sub-stage seed: same seed, same layout, on any device, forever.
function buildRound(worldId, modeId, n) {
  const rnd = mulberry32(hash(subStages(worldId, modeId)[n - 1].seed));
  const zones = WORLDS.find(w => w.id === worldId).zones, items = ITEMS[worldId].slice(), placed = [];
  for (let i = items.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [items[i], items[j]] = [items[j], items[i]];
  }
  const spot = (from, room) => Math.round((from + rnd() * room) * 100) / 100;
  items.forEach((item, i) => {
    const d = SIZE[item.size], fits = zones.filter(z => SIZE[z.maxSize] >= d);
    let p;
    for (let tries = 0; tries < 200; tries++) {
      const z = fits[Math.floor(rnd() * fits.length)], rests = z.surfaces[0] === 'shelf' || z.surfaces[0] === 'table';
      const x = spot(z.x + d / 2, z.w - d), y = rests ? z.y + z.h - d / 2 : spot(z.y + d / 2, z.h - d);
      p = { item, zone: z.id, x, y, target: i < 20 };
      if (!placed.some(q => Math.hypot(q.x - x, q.y - y) < (SIZE[q.item.size] + d) / 2 + 1)) break;
    }
    placed.push(p);
  });
  return placed;
}

  const w = save.progress.worlds[worldId] = save.progress.worlds[worldId] || { modes: {} };
  const m = w.modes[modeId] = w.modes[modeId] || { clearedSubStages: [], currentSubStage: 1 };

// Save code, house format: CC1-<base64url(save JSON)>-<FNV-1a checksum>
function exportCode() {
  const body = btoa(JSON.stringify(save)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  return `CC1-${body}-${hash(body).toString(36)}`;
}
function readCode(code) { // validates prefix, checksum, JSON shape and version; returns a save or null and never writes
  const m = /^CC1-([\w-]+)-([a-z0-9]+)$/.exec(code.trim());
  if (!m || hash(m[1]).toString(36) !== m[2]) return null;
  try {
    const s = JSON.parse(atob(m[1].replace(/-/g, '+').replace(/_/g, '/')));
    return validSave(s) ? s : null;
  } catch (e) { return null; }
}

function show(screen) {

const ACT = {
  show,
  world(id) { cur.world = id; show('modes'); },
  cat(id) { cur.cat = id || null; show('modes'); },
  machine(i) { if (MACHINES[i]) { cur.home = +i; show('home'); } },
  stage(n) { cur.n = +n; show('play'); },
  panel() { // one tap slides the whole sheet (checklist + Found Tray) down to its slim bar, or back; the scene re-fits as it moves
    const side = $('.side'), size = () => ({ width: side.offsetWidth + 'px', height: side.offsetHeight + 'px' }), from = size();
    document.body.classList.toggle('slimmed');
    side.animate([from, size()], { duration: 250, easing: 'ease' });
  },
  reset(n) { // two taps abandon one in-progress round; nothing else ever does

      show('stages');

      $(`.reset[data-arg="${n}"]`).classList.add('armed');
      $('#go-' + n).textContent = LABELS.ui.confirmReset;

// ---------- Hidden Object List: taps, the found sequence, the win ----------
function showCount() {
  const next = $('#list li:not(.done)');
  $('#count').textContent = `${document.querySelectorAll('#list .done').length} / 20 ${LABELS.ui.foundCount}`;
  $('#next').textContent = next ? next.textContent : '';
}
function keepRound() { // stores the live round in the save: on every find, and refreshed when a round is resumed
  (save.inProgress = save.inProgress || {})[roundKey(cur.world, PLAYABLE_MODE, cur.n)] = { found: round.found, updatedAt: Date.now() };
  storeSave();
}
function tapScene(ux, uy) {
  const r = round;
  let hit, best = Infinity;
  for (const p of r.placed) { // nearest unfound item; the hit area never drops below 44px on screen
    const d = Math.hypot(p.x - ux, p.y - uy);
    if (!r.found.includes(p.item.id) && d < best && d <= Math.max(SIZE[p.item.size] / 2, 2.2 / cam.s)) { hit = p; best = d; }
  }
  if (!hit) return;
  const el = $('#i-' + hit.item.id);
  if (!hit.target) { // wrong item: a gentle shake, nothing else
    el.classList.remove('shake');
    void el.offsetWidth;
    el.classList.add('shake');
    return;
  }
  r.found.push(hit.item.id); // from this moment the item can never be tapped again
  keepRound();
  el.classList.add('pop');
  el.insertAdjacentHTML('beforeend', `<svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" pathLength="100"/></svg>${sparks}`);
  setTimeout(() => { // ring held ~0.6s, then the item leaves the scene and flies to the Found Tray
    if (round !== r) return;
    $('#tray').insertAdjacentHTML('beforeend', gotChip(hit.item));
    const chip = $('#tray').lastChild, a = el.getBoundingClientRect(), slim = $('.slimmed .slim'); // slimmed: fly to the slim bar instead
    chip.style.visibility = 'hidden';
    chip.scrollIntoView({ block: 'nearest' });
    const b = (slim ? $('#count') : chip.firstChild).getBoundingClientRect();
    el.innerHTML = pic(hit.item);
    el.className = 'item fly';
    el.style.cssText = `left:${a.left}px;top:${a.top}px;width:${a.width}px;height:${a.height}px;font-size:${a.width * .6}px`;
    document.body.append(el);
    void el.offsetWidth;
    el.style.transform = `translate(${b.left - a.left}px,${b.top - a.top}px) scale(${b.height / a.height})`;
    setTimeout(() => {
      el.remove();
      if (round !== r) return;
      chip.style.visibility = '';
      $('#l-' + hit.item.id).classList.add('done');
      showCount();
      const strip = $('.slimmed .slim');
      if (strip) { // the sheet stays shut: its slim bar pulses once
        strip.classList.remove('pulse');
        void strip.offsetWidth;
        strip.classList.add('pulse');
      }
      if (document.querySelectorAll('#list .done').length === 20) win();
    }, 500);
  }, 600);
}
function win() {
  const got = clearSubStage(cur.world, PLAYABLE_MODE, cur.n);
  delete inProgress()[roundKey(cur.world, PLAYABLE_MODE, cur.n)];
  storeSave();
  app.insertAdjacentHTML('beforeend', `<div class="win"><div class="card"><h1>${LABELS.ui.win}</h1>` +
    `<p>${got ? `${LABELS.ui.newPiece} ${MACHINES[save.machines.justEarned.machine].name}.` : LABELS.ui.oldPiece}</p>` +
    btn('show', 'home', LABELS.ui.seeMachine) + (cur.n < 10 ? btn('stage', cur.n + 1, LABELS.ui.next) : '') +
    btn('show', 'stages', LABELS.ui.back) + `</div></div>`);
}

    return loaded && gained && carried && shown && $('#count').textContent.startsWith('2 / 20') && count('#tray .got') === 2 && count('#scene .item') === 28;
  });
  realSave === null ? localStorage.removeItem(KEY) : localStorage.setItem(KEY, realSave); // hand the real save back
  loadSave();
  applyAudio();
  cur.home = save.machines.current;
  show('home');
  history.replaceState(null, '', location.pathname + location.search);
  document.body.insertAdjacentHTML('beforeend', `<div class="win"><div class="card test"><h1>Self-test: ` +
    `${results.filter(r => r.includes('PASS')).length} of ${results.length} passed</h1><ul>${results.join('')}</ul></div></div>`);
}

loadSave();
applyAudio();
cur.home = save.machines.current;
show('home');
if (new URLSearchParams(location.search).get('selftest') === '1') selfTest();
</script>
</body>
</html>
